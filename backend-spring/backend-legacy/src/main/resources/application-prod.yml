# Production Profile Configuration

# CORS Configuration for Production
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

server:
  port: ${SERVER_PORT:9001}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  cookie:
    access-token:
      secure: true
    refresh-token:
      secure: true

# Actuator - restrict endpoints in production
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    com.ulticode: INFO
    org.springframework.security: WARN

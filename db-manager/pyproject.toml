[project]
name = "ulticode-db-manager"
version = "0.3.0"
description = "UltiCode database management tool using Flyway"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
db-manager = "db_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_manager"]

# P1-INFRA-005: test profile for service shell context-load tests.
# P7-MIGRATE-PROBLEM-001: exclude datasource/redis autoconfig in unit tests
# (context-load and shell smoke tests don't need real DB connections).
spring:
  profiles:
    active: test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

dubbo:
  application:
    name: backend-app-test
  registry:
    address: N/A
    register: false
    subscribe: false

management:
  health:
    redis:
      enabled: false
    db:
      enabled: false

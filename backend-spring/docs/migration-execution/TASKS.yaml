      clauses on ALTER TABLE).

      - Retained disposable-verify/ (docker-compose.verify.yml) as documented regression test fixture per AC2 option (b).

      - Database migration policy aligned with guide §15 and AGENTS.md immutability invariants.'
  commits:
  - 7071e1dd98d5210d9455c84bf0f268e686022727
  notes: Discovered during the disposable-environment dynamic verification of P2-AUTH-003 (2026-07-27). MySQL 9.1 rejects
    `ALTER TABLE ... DROP COLUMN IF EXISTS` and `ALTER TABLE ... DROP INDEX IF EXISTS` with syntax error 1064. The migration
    file is committed (133ae48) and frozen per AGENTS.md; this follow-up decides the correct portable form. The additive-only
    / lossless property is independently verified (15/5/1 row counts preserved through plain DROP); the SQL IF-EXISTS path
    was a documented defensive measure, not the project's primary rollback strategy (which is application rollback + additive
    schema retained, per guide §15).

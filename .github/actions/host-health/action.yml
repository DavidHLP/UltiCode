name: 'Host health check'
description: >-
  Unified post-deploy health check over SSH. One line per service:
  "<container> <mode> <port> <path>" where mode is one of
  curl-container (curl inside the container), curl-host (curl from the host),
  inspect (require Docker healthcheck == healthy). "-" is a placeholder.
inputs:
  ssh_key:
    required: true
  known_hosts:
    description: 'Environment-pinned known_hosts entries for the deploy host'
    required: true
  host:
    required: true
  port:
    required: false
    default: '22'
  user:
    required: true
  services:
    description: 'Multiline service spec'
    required: false
    default: |
      # Readiness probes (review 2026-08-25 P0): verify DB + Redis, 503 on failure.
      backend-auth curl-container 9101 /api/v1/auth/health/ready
      backend-admin curl-container 9102 /api/v1/admin/health/ready
      backend-app curl-container 9103 /api/v1/app/health/ready
      backend-notification curl-container 9105 /api/v1/notification/health/ready
      backend-submission inspect - -
      backend-search inspect - -
      backend-judge inspect - -
      console curl-host-https 9443 -
      management curl-host-https 9444 -
  attempts:
    description: 'Polls per service before failing'
    required: false
    default: '15'
  interval_seconds:
    required: false
    default: '5'
  deployment_path:
    description: 'Remote deployment root used for the post-health descriptor update'
    required: false
    default: ''
  deployment_descriptor_file:
    description: 'Deployment descriptor relative to deployment_path'
    required: false
    default: '.local/deploy/deployment.json'
  deployment_commit:
    description: 'Expected source commit recorded by host-deploy'
    required: false
    default: ''
  schema_manifest_checksum:
    description: 'Expected canonical migration manifest checksum recorded by host-deploy'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Install SSH key
      shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.ssh_key }}
        DEPLOY_KNOWN_HOSTS: ${{ inputs.known_hosts }}
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.user }}
        DEPLOY_PORT: ${{ inputs.port }}
      run: |
        "$GITHUB_WORKSPACE/scripts/deploy/health.sh" install-ssh-key

    - name: Check service health
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.user }}
        DEPLOY_PORT: ${{ inputs.port }}
        ATTEMPTS: ${{ inputs.attempts }}
        INTERVAL: ${{ inputs.interval_seconds }}
        SERVICES: ${{ inputs.services }}
        DEPLOYMENT_PATH: ${{ inputs.deployment_path }}
        DEPLOYMENT_DESCRIPTOR_FILE: ${{ inputs.deployment_descriptor_file }}
        DEPLOYMENT_COMMIT: ${{ inputs.deployment_commit }}
        EXPECTED_SCHEMA_MANIFEST_CHECKSUM: ${{ inputs.schema_manifest_checksum }}
      run: |
        "$GITHUB_WORKSPACE/scripts/deploy/health.sh" check-service-health

# Development-only host port mappings.
# Usage: docker compose --project-directory . -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d
services:
  mysql:
    ports:
      - "127.0.0.1:${DB_PORT:-23306}:3306"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-26379}:6379"

  nacos:
    ports:
      - "127.0.0.1:${NACOS_PORT:-28848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-29848}:9848"

  rustfs:
    # Host-run PM2 backends use the loopback S3 endpoint; browsers must never
    # be pointed at the container DNS name. Keep both RustFS listeners loopback-only.
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"

networks:
  # An internal network silently drops a published port: the container keeps its
  # PortBindings but nothing listens on the host, so a host-run backend fails the
  # object-store startup probe. Every network this overlay publishes from must be
  # un-internalized here.
  object-storage:
    internal: false
  sql:
    internal: false
  cache:
    internal: false
  registry:
    internal: false
  search:
    internal: false

name: Real acceptance
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  migration-safety:
    name: Fresh and upgrade migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Real MySQL fresh/upgrade/backfill/backup/FK and isolation drill
        run: bash scripts/dev/owner-migration-safety-integration-test.sh
  business:
    name: Clean install and real business lifecycle
    needs: migration-safety
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACCEPTANCE_DISPOSABLE: 'true'
      MISE_HTTP_TIMEOUT: 5m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Prepare pinned local test tools
        run: |
          npm install --global pm2@6.0.8
          mise install java@zulu-17.68.203.0
          pnpm exec playwright install --with-deps chromium
      - name: Fresh isolated install and real browser/Judge acceptance
        run: bash scripts/ci/business-acceptance.sh
      - name: Preserve reports without credentials or raw service logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: real-business-acceptance
          path: |
            .local/acceptance/installation.json
            .local/browser-acceptance/report.json
            .local/browser-business-acceptance/report.json
          if-no-files-found: warn
          retention-days: 14

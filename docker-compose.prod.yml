# Production Docker Compose override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file references pre-built images from GHCR instead of building locally.
# Required environment variables (set in deployment environment):
#   DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
#   REDIS_HOST, REDIS_PORT, REDIS_PASSWORD
#   JWT_SECRET
#   NACOS_USERNAME, NACOS_PASSWORD, NACOS_AUTH_TOKEN,
#   NACOS_AUTH_IDENTITY_KEY, NACOS_AUTH_IDENTITY_VALUE
#   GHCR_REGISTRY (optional, defaults to ghcr.io/davidhlp/ulticode-public-next)
#
# IMAGE_TAG usage:
#   export IMAGE_TAG=sha-abc1234  (or 'latest')
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The cd-deploy.yml workflow sets IMAGE_TAG via:
#   env.IMAGE_TAG = github.event.inputs.image_tag || 'latest'

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ulticode-nacos
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: ${DB_HOST:-mysql}
      MYSQL_SERVICE_PORT: ${DB_PORT:-3306}
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=true&allowPublicKeyRetrieval=true"
      JVM_XMS: 256m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?NACOS_AUTH_IDENTITY_KEY is required}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE is required}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  backend-auth:
    image: ${GHCR_REGISTRY:-ghcr.io/davidhlp/ulticode-public-next}/backend-auth:${IMAGE_TAG:-latest}
    container_name: ulticode-backend-auth
    restart: unless-stopped
    expose:
      - "9101"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-ulticode}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:-ulticode}
      # ARCH-002 preparation: set AUTH_DB_* to an isolated host/database/account
      # before the Auth cutover; fallback preserves the current local/shared mode.
      - AUTH_DB_HOST=${AUTH_DB_HOST:-${DB_HOST:-mysql}}
      - AUTH_DB_PORT=${AUTH_DB_PORT:-${DB_PORT:-3306}}
      - AUTH_DB_USER=${AUTH_DB_USER:-${DB_USER:-ulticode}}
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      - AUTH_DB_NAME=${AUTH_DB_NAME:-${DB_NAME:-ulticode}}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - DUBBO_REGISTRY_ADDRESS=nacos://nacos:8848?namespace=${DUBBO_NAMESPACE:-dev}
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - SERVER_PORT=9101
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:9002,http://localhost:9003}
      # SEARCH-003 gate: dispatch Auth user-document events to the search stream
      # (worker consumer is live in prod; see guide §11.5 enable order).
      - AUTH_SEARCH_OUTBOX_DISPATCHER_ENABLED=${AUTH_SEARCH_OUTBOX_DISPATCHER_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - default
      - infrastructure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/api/v1/auth/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  backend-admin:
    image: ${GHCR_REGISTRY:-ghcr.io/davidhlp/ulticode-public-next}/backend-admin:${IMAGE_TAG:-latest}
    container_name: ulticode-backend-admin
    restart: unless-stopped
    expose:
      - "9102"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-ulticode}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:-ulticode}
      # ARCH-002 preparation: set ADMIN_DB_* for the Admin schema/account.
      - ADMIN_DB_HOST=${ADMIN_DB_HOST:-${DB_HOST:-mysql}}
      - ADMIN_DB_PORT=${ADMIN_DB_PORT:-${DB_PORT:-3306}}
      - ADMIN_DB_USER=${ADMIN_DB_USER:-${DB_USER:-ulticode}}
      - ADMIN_DB_PASSWORD=${ADMIN_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      - ADMIN_DB_NAME=${ADMIN_DB_NAME:-${DB_NAME:-ulticode}}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - DUBBO_REGISTRY_ADDRESS=nacos://nacos:8848?namespace=${DUBBO_NAMESPACE:-dev}
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - SERVER_PORT=9102
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:9002,http://localhost:9003}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - default
      - infrastructure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9102/api/v1/admin/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  backend-app:
    image: ${GHCR_REGISTRY:-ghcr.io/davidhlp/ulticode-public-next}/backend-app:${IMAGE_TAG:-latest}
    container_name: ulticode-backend-app
    restart: unless-stopped
    expose:
      - "9103"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-ulticode}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:-ulticode}
      # ARCH-002 preparation: set APP_DB_* for App-owned aggregates.
      - APP_DB_HOST=${APP_DB_HOST:-${DB_HOST:-mysql}}
      - APP_DB_PORT=${APP_DB_PORT:-${DB_PORT:-3306}}
      - APP_DB_USER=${APP_DB_USER:-${DB_USER:-ulticode}}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      - APP_DB_NAME=${APP_DB_NAME:-${DB_NAME:-ulticode}}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - DUBBO_REGISTRY_ADDRESS=nacos://nacos:8848?namespace=${DUBBO_NAMESPACE:-dev}
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - SERVER_PORT=9103
      # This artifact exports only the direct Submission owner; rollback to local
      # requires the previous verified compatibility artifact.
      - APP_SUBMISSION_ROUTING_MODE=remote
      - SUBMISSION_CUTOVER_COMPLETE=${SUBMISSION_CUTOVER_COMPLETE:?SUBMISSION_CUTOVER_COMPLETE is required after the Submission schema cutover}
      - APP_FEATURES_USE_JUDGE_OUTBOX=true
      - APP_FEATURES_USE_GENERATION_FENCE=true
      - APP_FEATURES_JUDGE_QUEUE_USE_PORT=true
      - APP_FEATURES_JUDGE_QUEUE_ENVELOPE_VERSION=2
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:9002,http://localhost:9003}
      # SEARCH-003 gate: App /search reads MeiliSearch first with DB fallback
      # (guide §11.5); backfill runner is enabled via APP_SEARCH_BACKFILL_ENABLED.
      - MEILISEARCH_ENABLED=${MEILISEARCH_ENABLED:-true}
      - MEILI_HOST=${MEILI_HOST:-http://meilisearch:7700}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - default
      - infrastructure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9103/api/v1/app/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  backend-submission:
    image: ${GHCR_REGISTRY:-ghcr.io/davidhlp/ulticode-public-next}/backend-submission:${IMAGE_TAG:-latest}
    container_name: ulticode-backend-submission
    restart: unless-stopped
    expose:
      - "9106"
      - "20886"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    environment:
      # Submission owner must use its own provisioned credential. Do not fall
      # back to DB_USER: the runtime owner account is part of the cutover gate.
      - SUBMISSION_DB_HOST=${SUBMISSION_DB_HOST:-mysql}
      - SUBMISSION_DB_PORT=${SUBMISSION_DB_PORT:-3306}
      - SUBMISSION_DB_NAME=${SUBMISSION_DB_NAME:-submission}
      - SUBMISSION_DB_USER=${SUBMISSION_DB_USER:?SUBMISSION_DB_USER is required}
      - SUBMISSION_DB_PASSWORD=${SUBMISSION_DB_PASSWORD:?SUBMISSION_DB_PASSWORD is required}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=${REDIS_DB:-0}
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - DUBBO_REGISTRY_ADDRESS=nacos://nacos:8848?namespace=${DUBBO_NAMESPACE:-dev}
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - DUBBO_REGISTRY_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - DUBBO_REGISTRY_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - DUBBO_APPLICATION_NAME=backend-submission
      - SUBMISSION_SERVER_PORT=9106
      - SUBMISSION_DUBBO_PORT=20886
      - DUBBO_NAMESPACE=${DUBBO_NAMESPACE:-dev}
    depends_on:
      backend-app:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - default
      - infrastructure
    healthcheck:
      # Internal container probe only; the actuator endpoint is never exposed
      # outside the container network (CD inspects State.Health.Status).
      test: ["CMD", "curl", "-f", "http://localhost:9106/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  backend-search:
    image: ${GHCR_REGISTRY:-ghcr.io/davidhlp/ulticode-public-next}/backend-search:${IMAGE_TAG:-latest}
    container_name: ulticode-backend-search
    restart: unless-stopped
    expose:
      - "9107"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      # SEARCH-003 gate: worker is the sole MeiliSearch writer; the App
      # backfill runner must be run before/while it drains (guide §11.5).
      - SEARCH_WORKER_ENABLED=${SEARCH_WORKER_ENABLED:-true}
      - SEARCH_SERVER_PORT=9107
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - default
      - infrastructure
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  backend-notification:
    image: ${GHCR_REGISTRY:-ghcr.io/davidhlp/ulticode-public-next}/backend-notification:${IMAGE_TAG:-latest}
    container_name: ulticode-backend-notification
    restart: unless-stopped
    expose:
      - "9105"
      - "20885"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-ulticode}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:-ulticode}
      - NOTIFICATION_DB_HOST=${NOTIFICATION_DB_HOST:-${DB_HOST:-mysql}}
      - NOTIFICATION_DB_PORT=${NOTIFICATION_DB_PORT:-${DB_PORT:-3306}}
      - NOTIFICATION_DB_USER=${NOTIFICATION_DB_USER:-${DB_USER:-ulticode}}
      - NOTIFICATION_DB_PASSWORD=${NOTIFICATION_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      - NOTIFICATION_DB_NAME=${NOTIFICATION_DB_NAME:-${DB_NAME:-ulticode}}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - DUBBO_REGISTRY_ADDRESS=nacos://nacos:8848?namespace=${DUBBO_NAMESPACE:-dev}
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - SERVER_PORT=9105
      - NOTIFICATION_DUBBO_PORT=20885
      - NOTIFICATION_WORKER_ENABLED=${NOTIFICATION_WORKER_ENABLED:-true}
      - APP_EMAIL_ENABLED=${APP_EMAIL_ENABLED:-false}
      - APP_EMAIL_FROM_NAME=${APP_EMAIL_FROM_NAME:-UltiCode}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-${SMTP_USER:-}}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    depends_on:
      backend-auth:
        condition: service_healthy
      backend-app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - default
      - infrastructure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9105/api/v1/notification/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  backend-judge:
    image: ${GHCR_REGISTRY:-ghcr.io/davidhlp/ulticode-public-next}/backend-judge:${IMAGE_TAG:-latest}
    container_name: ulticode-backend-judge
    restart: unless-stopped
    expose:
      - "20884"
    deploy:
      resources:
        limits:
          memory: ${JUDGE_MEMORY_LIMIT:-2G}
          cpus: "${JUDGE_CPU_LIMIT:-4.0}"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - DUBBO_REGISTRY_ADDRESS=nacos://nacos:8848?namespace=${DUBBO_NAMESPACE:-dev}
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - DUBBO_REGISTRY_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - DUBBO_REGISTRY_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - JUDGE_SERVER_PORT=9104
      - JUDGE_DUBBO_PORT=20884
      - DUBBO_NAMESPACE=${DUBBO_NAMESPACE:-dev}
      - SANDBOX_ENABLED=${SANDBOX_ENABLED:-true}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ulticode-sandbox:latest}
      - SANDBOX_MEMORY=${SANDBOX_MEMORY:-256m}
      - SANDBOX_CPUS=${SANDBOX_CPUS:-1.0}
      - SANDBOX_TIMEOUT=${SANDBOX_TIMEOUT:-10}
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-128}
      # Operator-set profile wins; otherwise derive from the shared host dir.
      - SANDBOX_SECCOMP_PROFILE=${SANDBOX_SECCOMP_PROFILE:-${SANDBOX_HOST_DIR:-/opt/ulticode/sandbox}/seccomp-profile.json}
      # Redirect the JVM temp dir into the shared workspace so per-run sandbox
      # job dirs are visible to the host daemon. Operator JVM options from the
      # deployment .env are appended, not clobbered.
      - JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=${SANDBOX_HOST_DIR:-/opt/ulticode/sandbox}/workspace ${JAVA_TOOL_OPTIONS:-}
    depends_on:
      backend-app:
        condition: service_healthy
      backend-submission:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - default
      - infrastructure
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The path is identical inside the worker and on the Docker host. The
      # sandbox executor passes child-container mounts to the host daemon.
      - ${SANDBOX_HOST_DIR:-/opt/ulticode/sandbox}:${SANDBOX_HOST_DIR:-/opt/ulticode/sandbox}
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1 && docker image inspect $${SANDBOX_IMAGE} >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  console:
    image: ${GHCR_REGISTRY:-ghcr.io/davidhlp/ulticode-public-next}/console:${IMAGE_TAG:-latest}
    container_name: ulticode-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-9002}:8080"
    depends_on:
      backend-auth:
        condition: service_healthy
      backend-admin:
        condition: service_healthy
      backend-app:
        condition: service_healthy
      backend-notification:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  management:
    image: ${GHCR_REGISTRY:-ghcr.io/davidhlp/ulticode-public-next}/management:${IMAGE_TAG:-latest}
    container_name: ulticode-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MANAGEMENT_PORT:-9003}:8080"
    depends_on:
      backend-auth:
        condition: service_healthy
      backend-admin:
        condition: service_healthy
      backend-app:
        condition: service_healthy
      backend-notification:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

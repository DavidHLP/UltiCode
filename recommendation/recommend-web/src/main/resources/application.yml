spring:
  application:
    name: recommend-web

server:
  port: ${SERVER_PORT:9005}

dubbo:
  application:
    name: recommend-web
    qos-enable: false
  registry:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
    username: ${NACOS_USERNAME:?NACOS_USERNAME is required}
    password: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
    parameters:
      namespace: public
      group: DEFAULT_GROUP
      enable-empty-protection: "true"
  consumer:
    check: false
    timeout: 5000
  scan:
    base-packages: com.ulticode.recommend.web

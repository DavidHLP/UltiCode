# Manual deployment pipeline. Mechanics (SSH, migrations, sandbox prereqs,
# compose rollout) live in the shared .github/actions/host-deploy composite;
# health checking lives in .github/actions/host-health. Rollback reuses both.
name: CD Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      # Per-service rollout: any subset is pulled/up independently on the
      # host via host-deploy; 'all' keeps the previous whole-stack flow.
      services:
        description: 'Services to deploy'
        required: true
        type: choice
        options:
          - all
          - backend-auth
          - backend-admin
          - backend-app
          - backend-submission
          - backend-notification
          - backend-search
          - backend-judge
          - console
          - management
      skip_migrations:
        description: 'Skip database migrations'
        required: false
        type: boolean
        default: false
      image_refs:
        description: >-
          Required nine-line immutable release manifest with
          NAME=registry/path/service@sha256:digest entries. Obtain it from the
          Docker Publish supply-chain artifacts.
        required: true
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Deploy to host
        id: deploy
        uses: ./.github/actions/host-deploy
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          user: ${{ secrets.DEPLOY_USER }}
          path: ${{ secrets.DEPLOY_PATH }}
          image_refs: ${{ github.event.inputs.image_refs }}
          services: ${{ github.event.inputs.services }}
          supply_chain_identity: ${{ secrets.SUPPLY_CHAIN_CERT_IDENTITY }}
          skip_migrations: ${{ github.event.inputs.skip_migrations }}
          registry: ghcr.io
          github_token: ${{ secrets.GITHUB_TOKEN }}
          actor: ${{ github.actor }}
          # Owner migration credentials are separate from every runtime account.
          migration_db_host: ${{ secrets.MIGRATION_DB_HOST }}
          migration_db_port: ${{ secrets.MIGRATION_DB_PORT }}
          migration_db_name: ${{ secrets.MIGRATION_DB_NAME }}
          migration_db_user: ${{ secrets.MIGRATION_DB_USER }}
          migration_db_password: ${{ secrets.MIGRATION_DB_PASSWORD }}
          submission_migration_db_user: ${{ secrets.SUBMISSION_MIGRATION_DB_USER }}
          submission_migration_db_password: ${{ secrets.SUBMISSION_MIGRATION_DB_PASSWORD }}
          auth_db_user: ${{ secrets.AUTH_DB_USER }}
          admin_db_user: ${{ secrets.ADMIN_DB_USER }}
          app_db_user: ${{ secrets.APP_DB_USER }}
          notification_db_user: ${{ secrets.NOTIFICATION_DB_USER }}
          submission_db_user: ${{ secrets.SUBMISSION_DB_USER }}

      - name: Health check all services
        uses: ./.github/actions/host-health
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          user: ${{ secrets.DEPLOY_USER }}

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Deployment to ${{ github.event.inputs.environment }} failed. Check logs for details."

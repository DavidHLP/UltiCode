server:
  port: ${SERVER_PORT:3000}

spring:
  application:
    name: ulticode-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ulticode}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-characters-long}
  access-token:
    expiration: 900000  # 15 minutes in milliseconds
  refresh-token:
    expiration: 604800000  # 7 days in milliseconds
  cookie:
    name: ulticode_token
    http-only: true
    secure: ${JWT_COOKIE_SECURE:true}
    same-site: strict
    path: /
    max-age: 604800  # 7 days in seconds

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ulticode.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc Configuration
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Logging Configuration
logging:
  level:
    root: INFO
    com.ulticode: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# MeiliSearch Configuration (optional - for full-text search)
meilisearch:
  host: ${MEILISEARCH_HOST:}
  api-key: ${MEILISEARCH_API_KEY:}

# Recommendation Service Configuration (optional - for personalized recommendations)
recommendation:
  enabled: ${RECOMMENDATION_ENABLED:false}
  service-url: ${RECOMMENDATION_SERVICE_URL:}
  timeout: ${RECOMMENDATION_TIMEOUT:5000}
  nacos-enabled: ${RECOMMENDATION_NACOS_ENABLED:false}
  fallback-url: ${RECOMMENDATION_FALLBACK_URL:}

# Backup Configuration
backup:
  dir: ${BACKUP_DIR:/tmp/backups}

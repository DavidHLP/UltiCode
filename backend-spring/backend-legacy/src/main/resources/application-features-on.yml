# ADR-005 §4 #4: 5 个产品 flag 全开; cutover flag 默认保持 (依赖对应 milestone
# shipped 才能在生产打开). features-on profile 用于 CI 矩阵 "幸福路径" 场景.
#
# 重要: 此 profile 不开 cutover flag (use-judge-outbox / use-generation-fence /
# judge-queue.use-port / envelope-version=2) — 那些
# 走 cutover 守门 (ADR-005 §2.6/§2.7), 不在 CI matrix 范围. 在 CI 里强制开 cutover
# flag 会引入上游 milestone 依赖, 容易因 M3a/M3b/M3c 状态变化反复挂 CI.
#
# 配合 -Dspring.profiles.active=ci,features-on 使用.
# 切换方式 (生产): 见 docs/RUNBOOK.md §10.
spring:
  config:
    activate:
      on-profile: features-on
app:
  features:
    # 5 个产品功能 flag — 全部开启
    use-new-contest-system: true
    realtime-ranking-enabled: true
    first-solve-notifications-enabled: true
    anticheat-enabled: true
    contest-analytics-enabled: true
    # 5 个 cutover flag 保持默认值 (由 application.yml 决定, 不在本 profile override)
    # 若想开 cutover flag, 改 application.yml + 走 ADR-005 cutover 守门, 不要在
    # features-on profile 里强开.

# Optional managed OTLP overlay.
# Use explicitly with base + prod (or a deployment-owned equivalent):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.observability-managed.yml up -d
#
# The endpoint and headers come only from the deployment secret/environment
# surface. No provider account, token, or certificate is stored here.
services:
  backend-auth:
    environment:
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGED_OTLP_TRACING_ENDPOINT:?MANAGED_OTLP_TRACING_ENDPOINT is required}
      MANAGEMENT_OTLP_AUTHORIZATION: ${MANAGED_OTLP_AUTHORIZATION:-}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGED_OTLP_SAMPLING_PROBABILITY:-0.1}
  backend-admin:
    environment:
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGED_OTLP_TRACING_ENDPOINT:?MANAGED_OTLP_TRACING_ENDPOINT is required}
      MANAGEMENT_OTLP_AUTHORIZATION: ${MANAGED_OTLP_AUTHORIZATION:-}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGED_OTLP_SAMPLING_PROBABILITY:-0.1}
  backend-app:
    environment:
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGED_OTLP_TRACING_ENDPOINT:?MANAGED_OTLP_TRACING_ENDPOINT is required}
      MANAGEMENT_OTLP_AUTHORIZATION: ${MANAGED_OTLP_AUTHORIZATION:-}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGED_OTLP_SAMPLING_PROBABILITY:-0.1}
  backend-submission:
    environment:
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGED_OTLP_TRACING_ENDPOINT:?MANAGED_OTLP_TRACING_ENDPOINT is required}
      MANAGEMENT_OTLP_AUTHORIZATION: ${MANAGED_OTLP_AUTHORIZATION:-}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGED_OTLP_SAMPLING_PROBABILITY:-0.1}
  backend-notification:
    environment:
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGED_OTLP_TRACING_ENDPOINT:?MANAGED_OTLP_TRACING_ENDPOINT is required}
      MANAGEMENT_OTLP_AUTHORIZATION: ${MANAGED_OTLP_AUTHORIZATION:-}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGED_OTLP_SAMPLING_PROBABILITY:-0.1}
  backend-search:
    environment:
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGED_OTLP_TRACING_ENDPOINT:?MANAGED_OTLP_TRACING_ENDPOINT is required}
      MANAGEMENT_OTLP_AUTHORIZATION: ${MANAGED_OTLP_AUTHORIZATION:-}

# =============================================================================
# management/nginx.conf — frontend gateway (management SPA)
#
# Role: unique external entry point for the management SPA + its API +
# websocket traffic. Listens on :8080 inside the container; docker-compose
# .prod.yml maps 127.0.0.1:9003 -> 8080 (loopback only). There is no
# separate gateway service — this file IS the gateway.
#
# Deployment: this file is rendered by the nginx:alpine entrypoint as
#   COPY management/nginx.conf → /etc/nginx/templates/default.conf.template
#   → envsubst → /etc/nginx/conf.d/default.conf
# so the top of this file lives in nginx's `http {}` context (the base
# /etc/nginx/nginx.conf `include`s conf.d/*.conf), which is where the `map`
# directive below belongs.
#
# Contract:
#   - Route families terminate on their canonical owner services:
#     backend-auth:9101, backend-admin:9102, backend-app:9103, and
#     backend-notification:9105. The
#     gateway remains the only externally reachable API entry point.
#   - The app-owner catch-all `location /api/` keeps every business call
#     working with the existing frontend base (`/api/*`, set as
#     VITE_API_BASE_URL=/api in management/Dockerfile). The explicit route
#     family locations MUST all preserve their prefix in `proxy_pass`
#     (e.g. `proxy_pass http://backend-auth:9101/auth/;` for `/api/auth/`) so
#     behaviour is identical; they exist to (a) make the inventory
#     greppable and (b) attach per-family hardening (header strip, timeouts,
#     body caps).
#   - The frontend uses SockJS (not raw WebSocket). SockJS contacts
#     `${apiBaseUrl}${endpoint}` where the endpoints are `/ws/notifications`
#     and `/ws/contest`. In production with /api as base that becomes
#     `/api/ws/...`, and SockJS also hits the `/info` probe under the same
#     prefix. Both `/api/ws/` and `/ws/` are routed accordingly. The native
#     WebSocket and SockJS HTTP-fallback transports both work because the
#     `Connection` header is computed by the `$connection_upgrade` map,
#     not hardcoded to "upgrade".
#   - Every proxy location MUST `include .../backend-proxy.conf;` so the
#     client-forged identity header strip is uniform at the ingress — the
#     longest-prefix match means each family location wins, so any drift
#     between locations creates a security invariant violation. The single
#     source of truth for the strip set is
#     `infrastructure/nginx/includes/backend-proxy.conf`.
#
# This file is intentionally kept structured-identical with console/nginx.conf
# (each managing one frontend container's gateway); only the per-file label
# comments differ, so the two share the same inventory + the same ingress
# hardening. Diverge only when a family truly needs different auth or
# transforms.
#
# The route-family owner split is now active; keep API traffic on the
# canonical Auth/Admin/App services.
# =============================================================================

# Map `$http_upgrade` to a `Connection` value that is "upgrade" only when
# the client actually asked for an upgrade. Hardcoding `Connection: upgrade`
# for every request breaks SockJS' HTTP-fallback transports (xhr_streaming,
# xhr_polling, jsonp) — they need keep-alive / close semantics.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    access_log off;
    root /usr/share/nginx/html;
    index index.html;

    # Ignore incoming request headers whose names contain underscores before
    # proxying, closing the door on `X_User_Id` style smuggling.
    underscores_in_headers off;

    # === SSL/TLS Configuration (uncomment and configure for production) ===
    # listen 443 ssl http2;
    # ssl_certificate /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    #
    # Redirect HTTP to HTTPS:
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }

    # Security headers. The shared snippet `security-headers.conf` is
    # included at server scope; the SPA static-asset `location` block
    # re-includes it (nginx drops the inherited `add_header` chain as
    # soon as any location defines its own `add_header`).
    include /etc/nginx/conf.d/includes/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Cache static assets. nginx drops the server-scope `add_header`
    # chain whenever a location defines its own `add_header`, so we
    # re-include the shared security-headers snippet here to keep CSP,
    # X-Frame-Options, etc. on the static-asset response.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/conf.d/includes/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------------
    # Route family inventory
    #
    # Every route family below proxies to its canonical owner service. Each
    # location declares the family explicitly so the inventory is testable
    # (e.g. `grep 'location /api/admin/' management/nginx.conf`) and so owner
    # boundaries remain visible at the ingress. Adding a new proxy location?
    # It MUST also include `backend-proxy.conf` so the strip set stays uniform.
    # -------------------------------------------------------------------------

    # Identity / session endpoints (login, signup, csrf, oauth, etc.).
    location /api/auth/ {
        proxy_pass http://backend-auth:9101/auth/;
        include /etc/nginx/conf.d/includes/backend-proxy.conf;
    }

    # Backward-compat: password mutation was formerly at /api/users/me/password
    # when Legacy was the /api/ catch-all target. After the catch-all moved to
    # backend-app, this exact-match location keeps the old path alive by routing
    # it to the Auth-owned credential controller. Remove after all clients use
    # /api/auth/me/password (AUTH-COMP-001 compatibility window).
    location = /api/users/me/password {
        proxy_pass http://backend-auth:9101/auth/me/password;
        include /etc/nginx/conf.d/includes/backend-proxy.conf;
    }

    # Administrative console (admin users, audit log, settings, moderation
    # tooling surfaced through the admin SPA, etc.).
    location /api/admin/ {
        proxy_pass http://backend-admin:9102/admin/;
        include /etc/nginx/conf.d/includes/backend-proxy.conf;
    }

    # Notification history/preferences and email administration are owned by
    # backend-notification. WebSocket delivery remains on the App relay below.
    location /api/notifications/ {
        proxy_pass http://backend-notification:9105/notifications/;
        include /etc/nginx/conf.d/includes/backend-proxy.conf;
    }
    location = /api/notifications {
        proxy_pass http://backend-notification:9105/notifications;
        include /etc/nginx/conf.d/includes/backend-proxy.conf;
    }
    location /api/email/ {
        proxy_pass http://backend-notification:9105/email/;
        include /etc/nginx/conf.d/includes/backend-proxy.conf;
    }
    location = /api/email {
        proxy_pass http://backend-notification:9105/email;
        include /etc/nginx/conf.d/includes/backend-proxy.conf;
    }

    # Community moderation queue, reports, appeals.
    location /api/moderation/ {
        proxy_pass http://backend-app:9103/moderation/;
        include /etc/nginx/conf.d/includes/backend-proxy.conf;
    }

    # App-domain traffic surfaced by the management SPA: contests, problems,
    # submissions, forum, notifications, search, etc. This is the broad
    # "everything the user-facing app calls" family. The literal `/api`
    # prefix remains the catch-all so unchanged callers still work.
    location /api/ {
        proxy_pass http://backend-app:9103/;
        include /etc/nginx/conf.d/includes/backend-proxy.conf;
    }

    # WebSocket / SockJS families. SockJS probes the `/info` path under the
    # same prefix and then negotiates `/<server>/<session>/<transport>`
    # sub-paths, so this must be a prefix location. SockJS HTTP-fallback
    # transports use long polling, which is why `Connection` is the
    # `$connection_upgrade` map (not the literal string "upgrade"); the
    # extended timeouts + buffering off live here because long-poll /
    # streaming responses must NOT be buffered to a tempfile.
    location /api/ws/ {
        proxy_pass http://backend-app:9103/ws/;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
        include /etc/nginx/conf.d/includes/backend-proxy.conf;
    }
    location /ws/ {
        proxy_pass http://backend-app:9103/ws/;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
        include /etc/nginx/conf.d/includes/backend-proxy.conf;
    }

    # SPA fallback - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

packages:
  - "."
overrides:
  dompurify: 3.4.5
  lodash-es: 4.18.1
  protocol-buffers-schema: 3.6.1
  vite: ^8.0.16
  form-data: ^4.0.6
# pnpm 11: onlyBuiltDependencies is replaced by allowBuilds (ignoredBuiltDependencies
# stays as the explicit-ignore list; allowBuilds:true is the per-package approval).
ignoredBuiltDependencies:
  - esbuild
  - maplibre-gl
  - msw
  - vue-demi
allowBuilds:
  esbuild: true
  maplibre-gl: true
  msw: true
  vue-demi: true

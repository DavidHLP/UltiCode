services:
  mysql:
    image: mysql:9.1
    container_name: ulticode-mysql
    # Bind to all interfaces so IPv4 port-mapped connections (localhost:23306) reach the
    # MySQL handshake. Without this, MySQL 9.1 listens on IPv6 [::]:3306 only, and Docker
    # Desktop on WSL2 fails to forward the IPv4→IPv6 handshake to the container.
    command: ["--bind-address=0.0.0.0"]
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-ulticode}
      MYSQL_USER: ${DB_USER:-ulticode}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infrastructure

  redis:
    image: redis:7-alpine
    container_name: ulticode-redis
    expose:
      - "6379"
    # Review 2026-08-25 FINAL P1: Redis owner security boundary. The server
    # boots with an ACL file defining one user per owner/security domain.
    # In dev each owner password falls back to REDIS_PASSWORD (parity with
    # the old shared-secret setup); production overrides require distinct
    # values per owner. Owner users get data commands only — admin commands
    # (@dangerous) stay exclusive to the default/operator user.
    command:
      - sh
      - -c
      - |
        cat > /tmp/users.acl <<EOF
        user default on >$${REDIS_PASSWORD} ~* &* +@all
        user auth on >$${REDIS_PASSWORD_AUTH} ~* &* +@read +@write +@stream +@pubsub +@scripting +ping
        user admin on >$${REDIS_PASSWORD_ADMIN} ~* &* +@read +@write +@stream +@pubsub +@scripting +ping
        user app on >$${REDIS_PASSWORD_APP} ~* &* +@read +@write +@stream +@pubsub +@scripting +ping
        user submission on >$${REDIS_PASSWORD_SUBMISSION} ~* &* +@read +@write +@stream +@pubsub +@scripting +ping
        user notification on >$${REDIS_PASSWORD_NOTIFICATION} ~* &* +@read +@write +@stream +@pubsub +@scripting +ping
        user search on >$${REDIS_PASSWORD_SEARCH} ~* &* +@read +@write +@stream +@pubsub +@scripting +ping
        user judge on >$${REDIS_PASSWORD_JUDGE} ~* &* +@read +@write +@stream +@pubsub +@scripting +ping
        EOF
        exec redis-server --aclfile /tmp/users.acl
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_PASSWORD_AUTH: ${REDIS_PASSWORD_AUTH:-${REDIS_PASSWORD}}
      REDIS_PASSWORD_ADMIN: ${REDIS_PASSWORD_ADMIN:-${REDIS_PASSWORD}}
      REDIS_PASSWORD_APP: ${REDIS_PASSWORD_APP:-${REDIS_PASSWORD}}
      REDIS_PASSWORD_SUBMISSION: ${REDIS_PASSWORD_SUBMISSION:-${REDIS_PASSWORD}}
      REDIS_PASSWORD_NOTIFICATION: ${REDIS_PASSWORD_NOTIFICATION:-${REDIS_PASSWORD}}
      REDIS_PASSWORD_SEARCH: ${REDIS_PASSWORD_SEARCH:-${REDIS_PASSWORD}}
      REDIS_PASSWORD_JUDGE: ${REDIS_PASSWORD_JUDGE:-${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infrastructure

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ulticode-nacos
    expose:
      - "8848"
      - "9848"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
      JVM_XMS: 256m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?NACOS_AUTH_IDENTITY_KEY is required}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE is required}
    volumes:
      - nacos_logs:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - infrastructure

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: ulticode-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_DB_PATH=/meili_data
    expose:
      - "7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - default
      - infrastructure

networks:
  infrastructure:
    internal: true

volumes:
  mysql_data:
  redis_data:
  nacos_logs:
  meili_data:

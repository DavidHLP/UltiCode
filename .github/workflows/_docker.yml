# Reusable: docker build verification for every deployable service.
# The service list lives in .github/services-matrix.json — one file shared
# with docker-publish.yml. Adding a service means adding one JSON entry.
name: Docker Verify

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  load-matrix:
    name: Load Service Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read services matrix
        id: m
        run: |
          jq -e 'type == "array" and length > 0' .github/services-matrix.json > /dev/null \
            || { echo "::error::.github/services-matrix.json must be a non-empty array"; exit 1; }
          echo "matrix=$(jq -c . .github/services-matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Validate immutable supply-chain contract
        run: bash scripts/test/supply-chain-contract.sh

      - name: Validate observability control plane
        run: bash scripts/test/observability-contract.sh

      - name: Validate deployment integrity control plane
        run: bash scripts/test/deployment-integrity-contract.sh
      - name: Validate Dubbo mTLS identity policy
        run: bash scripts/test/dubbo-mtls-contract.sh
      - name: Validate service network reachability policy
        run: bash scripts/test/network-reachability-contract.sh

  docker-verify:
    name: Docker Build (${{ matrix.service.name }})
    needs: load-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.load-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          build-args: |
            SERVICE_MODULE=${{ matrix.service.module }}
            SERVICE_ARTIFACT=${{ matrix.service.artifact }}
            SERVICE_PORT=${{ matrix.service.port }}
            SERVICE_HEALTH_PATH=${{ matrix.service.health_path }}
            INSTALL_DOCKER_CLI=${{ matrix.service.install_docker_cli || false }}
            SERVICE_HEALTHCHECK=${{ matrix.service.healthcheck || true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

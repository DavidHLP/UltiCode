spring:
  application:
    name: ulticode-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ulticode}_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 0  # Random port for tests

app:
  jwt:
    secret: test-secret-key-must-be-at-least-256-bits-long-for-testing
    expiration-ms: 3600000  # 1 hour

  websocket:
    realtime-ranking:
      enabled: true
    first-solve-notifications:
      enabled: true
    allowed-origins:
      - http://localhost:*

logging:
  level:
    root: WARN
    com.ulticode: DEBUG

spring:
  application:
    name: recommend-provider
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      timeout: 3000ms

server:
  port: ${SERVER_PORT:9004}

dubbo:
  application:
    name: recommend-provider
    qos-enable: false
    service-discovery:
      auto: false
  registry:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
    username: ${NACOS_USERNAME:?NACOS_USERNAME is required}
    password: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
    check: false
    use-as-config-center: false
    use-as-metadata-center: false
    parameters:
      namespace: public
      group: DEFAULT_GROUP
      enable-empty-protection: "true"
  protocol:
    name: dubbo
    port: 20881
  scan:
    base-packages: com.ulticode.recommend.provider
  consumer:
    check: false

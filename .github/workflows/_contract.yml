# Reusable: contract compatibility gate — binary compatibility of Dubbo api/* contracts.
# Path filtering happens in the caller (ci.yml); all jobs here run when called.
name: Contract Compatibility

on:
  workflow_call:
    inputs:
      baseline_ref:
        description: 'Baseline tag/ref to compare against (optional, defaults to nearest tag)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  contract-compat:
    name: Contract Compatibility (japicmp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate API contract ownership boundary
        run: bash scripts/test/api-contract-boundary-contract.sh

      - name: Determine baseline ref
        id: baseline
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.baseline_ref }}" ]]; then
            echo "ref=${{ inputs.baseline_ref }}" >> "$GITHUB_OUTPUT"
            echo "[contract] using explicit baseline_ref=${{ inputs.baseline_ref }}"
            exit 0
          fi
          if ref=$(git describe --tags --abbrev=0 2>/dev/null); then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "[contract] baseline ref=$ref (git describe --tags --abbrev=0)"
          else
            echo "::error::No release tag found (git describe --tags --abbrev=0 failed). Please create a release tag (e.g. git tag v1.0.0 && git push origin v1.0.0) to establish a contract baseline."
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Grant Maven wrapper execute permission
        run: chmod +x services/mvnw

      - name: Create baseline worktree
        run: |
          set -euo pipefail
          ref="${{ steps.baseline.outputs.ref }}"
          echo "[contract] creating worktree for $ref at /tmp/baseline"
          git worktree add /tmp/baseline "$ref"
          if [[ -e /tmp/baseline/services/mvnw ]]; then
            chmod +x /tmp/baseline/services/mvnw
          elif [[ -e /tmp/baseline/backend-spring/mvnw ]]; then
            chmod +x /tmp/baseline/backend-spring/mvnw
          fi
      - name: Install baseline api contracts
        id: baseline_contracts
        run: |
          set -euo pipefail
          baseline_root=/tmp/baseline
          if [[ -d "$baseline_root/services" ]]; then
            baseline_services="$baseline_root/services"
            baseline_projects=(
              api/auth-api
              api/app-api
              api/submission-api
              api/notification-api
            )
            present_projects=()
            for project in "${baseline_projects[@]}"; do
              if [[ -f "$baseline_services/$project/pom.xml" ]]; then
                present_projects+=("$project")
              fi
            done
            if (( ${#present_projects[@]} == 0 )); then
              echo "has_standalone_contracts=false" >> "$GITHUB_OUTPUT"
              echo "baseline has no standalone API contracts; compatibility comparison skipped"
              exit 0
            fi
            if (( ${#present_projects[@]} != ${#baseline_projects[@]} )); then
              echo "::error::Baseline has an incomplete standalone API contract set; compatibility comparison cannot run safely"
              exit 1
            fi
            baseline_revision="$({
              cd "$baseline_services"
              ./mvnw help:evaluate -Dexpression=revision -q -DforceStdout
            } | tail -n 1)"
            if [[ ! "$baseline_revision" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
              echo "::error::Could not resolve a safe Maven revision from the standalone baseline POM"
              exit 1
            fi
            echo "old_version=$baseline_revision" >> "$GITHUB_OUTPUT"
            echo "has_standalone_contracts=true" >> "$GITHUB_OUTPUT"
            echo "[contract] baseline API revision=$baseline_revision"
          elif [[ -d "$baseline_root/backend-spring" ]]; then
            echo "has_standalone_contracts=false" >> "$GITHUB_OUTPUT"
            echo "baseline has no standalone API contracts; compatibility comparison skipped"
            exit 0
          else
            echo "::error::Baseline ref has no supported backend root"
            exit 1
          fi
          cd "$baseline_services"
          ./mvnw -pl "$(IFS=,; echo "${baseline_projects[*]}")" -am \
            -Drevision="${baseline_revision}" -DskipTests install -B

      - name: Record skipped contract compatibility comparison
        if: ${{ steps.baseline_contracts.outputs.has_standalone_contracts != 'true' }}
        run: echo "baseline has no standalone API contracts; compatibility comparison skipped"

      - name: Build current api contracts
        if: ${{ steps.baseline_contracts.outputs.has_standalone_contracts == 'true' }}
        run: |
          set -euo pipefail
          echo "[contract] building current api contracts at a distinct revision"
          cd services
          ./mvnw -Drevision=1.0.0-ci.${GITHUB_RUN_ID} \
            -pl api/auth-api,api/app-api,api/submission-api,api/notification-api \
            -am -DskipTests package -B

      - name: Run japicmp contract compat check
        if: ${{ steps.baseline_contracts.outputs.has_standalone_contracts == 'true' }}
        run: |
          set -euo pipefail
          echo "[contract] running japicmp against installed baseline ${{ steps.baseline_contracts.outputs.old_version }}"
          cd services
          ./mvnw -Drevision=1.0.0-ci.${GITHUB_RUN_ID} \
            -Dcontract.compat.oldVersion="${{ steps.baseline_contracts.outputs.old_version }}" \
            -P contract-compat \
            -pl api/auth-api,api/app-api,api/submission-api,api/notification-api \
            -am verify -B
      - name: Assert japicmp compares distinct artifacts
        if: ${{ steps.baseline_contracts.outputs.has_standalone_contracts == 'true' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          reports = [
              "services/api/auth-api/target/japicmp/contract-compat-check.xml",
              "services/api/app-api/target/japicmp/contract-compat-check.xml",
              "services/api/submission-api/target/japicmp/contract-compat-check.xml",
              "services/api/notification-api/target/japicmp/contract-compat-check.xml",
          ]
          for report in reports:
              root = ET.parse(report).getroot()
              old_jar = root.attrib.get("oldJar", "").strip()
              new_jar = root.attrib.get("newJar", "").strip()
              old_version = root.attrib.get("oldVersion", "").strip()
              missing = {"", "n.a.", "n/a", "na"}
              if old_jar.lower() in missing or new_jar.lower() in missing or old_version.lower() in missing:
                  raise SystemExit(
                      f"japicmp baseline artifact/version is missing in {report}; compatibility comparison skipped unexpectedly"
                  )
              if old_jar == new_jar:
                  raise SystemExit(f"japicmp self-comparison detected in {report}")
          print("japicmp distinct-baseline guard: PASS")
          PY

      - name: Upload japicmp reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: japicmp-reports
          path: |
            services/api/**/target/japicmp/**
            services/**/target/japicmp/**
          if-no-files-found: warn
          retention-days: 7

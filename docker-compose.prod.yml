# Production Docker Compose override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file references pre-built images from GHCR instead of building locally.
# Required environment variables (set in deployment environment):
#   DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
#   REDIS_HOST, REDIS_PORT
#   JWT_SECRET
#   GHCR_REGISTRY (optional, defaults to ghcr.io/davidhlp/ulticode-public-next)

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ulticode-nacos
    restart: unless-stopped
    ports:
      - "28848:8848"
      - "28080:8080"
      - "29848:9848"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: ${DB_HOST:-mysql}
      MYSQL_SERVICE_PORT: ${DB_PORT:-3306}
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=true&allowPublicKeyRetrieval=true"
      JVM_XMS: 256m
      JVM_XMX: 512m
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  backend:
    image: ${GHCR_REGISTRY:-ghcr.io/davidhlp/ulticode-public-next}/backend:${IMAGE_TAG:-latest}
    container_name: ulticode-backend
    restart: unless-stopped
    ports:
      - "9001:9001"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-ulticode}
      - DB_PASSWORD=${DB_PASSWORD:-ulticode}
      - DB_NAME=${DB_NAME:-ulticode}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - SERVER_PORT=9001
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  console:
    image: ${GHCR_REGISTRY:-ghcr.io/davidhlp/ulticode-public-next}/console:${IMAGE_TAG:-latest}
    container_name: ulticode-console
    restart: unless-stopped
    ports:
      - "9002:8080"
    environment:
      - API_ORIGIN=http://backend:9001
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  management:
    image: ${GHCR_REGISTRY:-ghcr.io/davidhlp/ulticode-public-next}/management:${IMAGE_TAG:-latest}
    container_name: ulticode-management
    restart: unless-stopped
    ports:
      - "9003:8080"
    environment:
      - API_ORIGIN=http://backend:9001
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  recommend-provider:
    image: ${RECOMMEND_IMAGE_TAG:-latest}
    container_name: ulticode-recommend-provider
    ports:
      - "20881:20881"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RECOMMENDATION_ENABLED: "true"
      RECOMMENDATION_NACOS_ENABLED: "true"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  recommend-web:
    image: ${RECOMMEND_WEB_IMAGE_TAG:-latest}
    container_name: ulticode-recommend-web
    ports:
      - "9005:9005"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

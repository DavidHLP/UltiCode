# Flyway Configuration for Seed Data (dev/test only)
# Extends the shared migration chain with the isolated seed location.
# Production uses flyway.conf (migrations only); dev/test may use this file to include seed data.
# Existing 15 seed migrations in migrations/V20260603* remain in place for backward compatibility;
# new seeds should be placed in migrations/seed/ and will be picked up via this config.
flyway.locations=filesystem:migrations/*.sql,filesystem:migrations/seed
flyway.table=flyway_schema_history
flyway.baselineOnMigrate=false
flyway.validateOnMigrate=true

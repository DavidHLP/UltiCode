stages:
  - build
  - deploy

variables:
  DOCKER_HOST: unix:///var/run/docker.sock

# Build stage - build all Docker images
build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
  script:
    - echo "Building Docker images..."
    - docker compose -f docker-compose.yml build
  only:
    - main
  tags:
    - docker

# Deploy stage - deploy to same server
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to server..."
    - ssh -p 22 $SSH_USER@$SSH_SERVER "cd /home/$SSH_USER/UltiCode && git pull origin main && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build"
  only:
    - main
  environment:
    name: production
    url: http://$SSH_SERVER:9001

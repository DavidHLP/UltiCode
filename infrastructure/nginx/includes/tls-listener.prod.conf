# Production-only listener overlay, mounted over tls-listener.conf.
# Certificates are supplied by the deployment secret mount, never Git.
listen 8443 ssl;
ssl_certificate /etc/nginx/tls/fullchain.pem;
ssl_certificate_key /etc/nginx/tls/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# The same server block handles the legacy HTTP listener only to redirect it.
if ($scheme = http) {
    return 301 https://$host$request_uri;
}

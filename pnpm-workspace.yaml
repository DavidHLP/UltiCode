# ---------------------------------------------------------------------------
# pnpm workspace — UltiCode frontends (apps) + shared packages
#
# Adding a new shared package: drop it under `packages/<name>/`.
# Consumers reference it via `workspace:*`.
# ---------------------------------------------------------------------------
packages:
  - "apps/*"
  - "packages/*"
overrides:
  dompurify: 3.4.17
  follow-redirects: 1.16.1
  markdown-it: 15.0.3
  # Patch transitive CLI/parser dependencies without crossing consumer majors.
  brace-expansion@5: 5.0.12
  browserslist: ^4.28.7
  fast-uri@3: ^3.1.8
  lodash-es: 4.18.1
  protocol-buffers-schema: 3.6.1
  # GHSA-jrc7-96c5-q579: patched MapLibre pulled in by Unovis.
  maplibre-gl: 6.4.1
  vite: ^8.0.16
  form-data: ^4.0.6
  # GHSA-v245-v573-v5vm / nanoid loop DoS / postcss source-map traversal —
  # pinned above vulnerable ranges until transitive deps catch up.
  # Caret-pinned to the patched release of each consumer-major line; a bare
  # '>=' would jump majors. linkify-it follows markdown-it 15, which imports
  # the named `LinkifyIt` export that only linkify-it 6 provides.
  linkify-it: ^6.0.0
  nanoid: ^3.3.18
  postcss: ^8.5.18
  # GHSA-68fv-2mgg-jv7q: indexed source-map offsets can block the event loop.
  source-map-js: 1.2.2
  # Keep both applications and the Markdown plugin on the same renderer.
  katex: 0.19.0
ignoredBuiltDependencies:
  - esbuild
  - maplibre-gl
  - msw
  - vue-demi
allowBuilds:
  esbuild: true
  maplibre-gl: true
  msw: true
  vue-demi: true

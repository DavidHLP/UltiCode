name: Docker Publish

on:
  push:
    branches: [main]

concurrency:
  group: docker-publish
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend-auth
            dockerfile: ./services/Dockerfile
            module: auth
            artifact: app.jar
            port: 9101
            health_path: /api/v1/auth/health
          - name: backend-admin
            dockerfile: ./services/Dockerfile
            module: admin
            artifact: app-exec.jar
            port: 9102
            health_path: /api/v1/admin/health
          - name: backend-app
            dockerfile: ./services/Dockerfile
            module: app/app-web
            artifact: app-exec.jar
            port: 9103
            health_path: /api/v1/app/health
          - name: backend-submission
            dockerfile: ./services/Dockerfile
            module: submission
            artifact: submission-exec.jar
            port: 9106
            health_path: /disabled
            healthcheck: 'false'
          - name: backend-notification
            dockerfile: ./services/Dockerfile
            module: notification
            artifact: notification-exec.jar
            port: 9105
            health_path: /api/v1/notification/health
          - name: backend-judge
            dockerfile: ./services/Dockerfile
            module: judge
            artifact: judge-exec.jar
            port: 9104
            health_path: /disabled
            install_docker_cli: 'true'
            healthcheck: 'false'
          - name: console
            dockerfile: ./apps/console/Dockerfile
          - name: management
            dockerfile: ./apps/management/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_MODULE=${{ matrix.service.module }}
            SERVICE_ARTIFACT=${{ matrix.service.artifact }}
            SERVICE_PORT=${{ matrix.service.port }}
            SERVICE_HEALTH_PATH=${{ matrix.service.health_path }}
            INSTALL_DOCKER_CLI=${{ matrix.service.install_docker_cli || false }}
            SERVICE_HEALTHCHECK=${{ matrix.service.healthcheck || true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

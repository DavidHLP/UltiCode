# P1-INFRA-005: test profile for service shell context-load tests.
# Unit tests assert the HTTP health endpoint and populated auth-shell context.
# Nacos registration is validated by the manual smoke script, not here.
server:
  port: 0

spring:
  application:
    name: backend-auth
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  mail:
    host: localhost
    port: 1025

management:
  health:
    mail:
      enabled: false

# JWT test secret must be >= 256 bits (32 bytes) for HS256.
jwt:
  secret: "test-test-test-test-test-test-test-test"
  access-token:
    expiration: 3600000
  refresh-token:
    expiration: 86400000

dubbo:
  registry:
    register: false
    subscribe: false
  protocol:
    port: -1

logging:
  level:
    com.ulticode: INFO

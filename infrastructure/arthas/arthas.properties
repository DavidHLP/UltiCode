# Project-level Arthas configuration for UltiCode.
#
# Synced by scripts/start-arthas.sh (sync_arthas_properties) to
# ~/.arthas/lib/<version>/arthas/arthas.properties on every attach —
# this is the path the arthas-agent actually reads at startup.
# (NOT ~/.arthas/arthas.properties, which the agent ignores.)
#
# Content mirrors the 4.2.2 jar's embedded defaults; the only project
# override is arthas.mcpProtocol=STATELESS (see below). When upgrading
# Arthas, diff against the new embedded properties and re-merge any new
# keys.
#
# Why STATELESS:
#   4.2.2 default is STREAMABLE, which forces a mcp-session-id header on
#   every tools/call. The Claude Code built-in MCP client
#   (mcp__arthas-mcp__*) does not maintain a session, so dashboard /
#   thread / monitor / trace / watch hang (4.4KB "Session ID required"
#   error stack on every call). STATELESS swaps in
#   McpStatelessHttpRequestHandler and skips the session check, so
#   simple commands return in <500ms and enhancement commands
#   (monitor/trace/watch) return in seconds when the target method is
#   actually invoked.
#
# Re-attach to apply: pm2 restart ulticode-9001.
#arthas.config.overrideAll=true
arthas.telnetPort=3658
arthas.httpPort=8563
arthas.ip=127.0.0.1

# seconds
arthas.sessionTimeout=10800

#arthas.enhanceLoaders=java.lang.ClassLoader

# https://arthas.aliyun.com/doc/en/auth
# arthas.username=arthas
# arthas.password=arthas

# local connection non auth, like telnet 127.0.0.1 3658
arthas.localConnectionNonAuth=true

#arthas.appName=demoapp
#arthas.tunnelServer=ws://127.0.0.1:7777/ws
#arthas.agentId=mmmmmmyiddddd

#arthas.disabledCommands=stop,dump
#arthas.commandLocations=/opt/arthas/ext-command.jar,/opt/arthas/ext-commands
# if ${arthas.home}/commands exists, Arthas will also try to load *.jar from it

#arthas.outputPath=arthas-output

# MCP (Model Context Protocol) configuration
arthas.mcpEndpoint=/mcp
arthas.mcpProtocol=STATELESS

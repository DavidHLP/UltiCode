global:
  resolve_timeout: 5m

route:
  group_by: [alertname, owner, application]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: local-ops-webhook
  routes:
    - matchers:
        - severity="critical"
      receiver: local-ops-webhook
      repeat_interval: 1h
    - matchers:
        - severity="warning"
      receiver: local-ops-webhook

receivers:
  # Replace this endpoint in the deployment-owned Alertmanager override. The
  # local default is deliberately loopback-like and contains no credential.
  - name: local-ops-webhook
    webhook_configs:
      - url: http://host.docker.internal:9094/alerts
        send_resolved: true

# CI override: build images locally instead of pulling from GHCR
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml up -d --build

services:
  backend:
    image: ulticode-backend:latest
    build:
      context: .
      dockerfile: backend-spring/Dockerfile

  console:
    image: ulticode-console:latest
    build:
      context: .
      dockerfile: console/Dockerfile

  management:
    image: ulticode-management:latest
    build:
      context: .
      dockerfile: management/Dockerfile

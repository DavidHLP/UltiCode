server:
  port: ${SERVER_PORT:9102}
  shutdown: graceful

spring:
  application:
    name: backend-admin
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:45s}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ADMIN_DB_HOST}:${ADMIN_DB_PORT}/${ADMIN_DB_NAME}?useUnicode=true&characterEncoding=UTF-8&characterSetResults=utf8mb4&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${ADMIN_DB_USER}
    password: ${ADMIN_DB_PASSWORD}
  # The Admin shell keeps shared Redis wiring for its own integrations; App-owned
  # queue/sandbox components are outside BackendAdminApplication's bounded scan.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      # Per-owner Redis ACL user (review 2026-08-25). Empty default keeps
      # no-auth local dev working; compose maps it per service.
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8

backup:
  dir: ${BACKUP_DIR:/tmp/backups}
  process:
    timeout-seconds: ${BACKUP_PROCESS_TIMEOUT_SECONDS:1800}
    mysqldump-path: ${BACKUP_PROCESS_MYSQLDUMP_PATH:mysqldump}
    mysql-path: ${BACKUP_PROCESS_MYSQL_PATH:mysql}

app:
  features:
    # dev-lite routes Contest through the App owner; Submission remains local
    # until the explicit remote cutover gate is complete.
    contest-dubbo-cutover: ${APP_FEATURES_CONTEST_DUBBO_CUTOVER:false}
    submission-dubbo-cutover: ${APP_FEATURES_SUBMISSION_DUBBO_CUTOVER:false}

admin:
  scheduler:
    audit-pool-size: ${ADMIN_AUDIT_SCHEDULER_POOL_SIZE:2}
    reconciliation-pool-size: ${ADMIN_RECONCILIATION_SCHEDULER_POOL_SIZE:1}
    backup-pool-size: ${ADMIN_BACKUP_SCHEDULER_POOL_SIZE:1}
  lease:
    ttl-ms: ${ADMIN_FENCED_LEASE_TTL_MS:600000}
  audit:
    inbox:
      enabled: ${ADMIN_AUDIT_INBOX_ENABLED:true}
      interval-ms: ${ADMIN_AUDIT_INBOX_INTERVAL_MS:2000}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ulticode.modules.admin.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    db:
      enabled: false
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 5s

security:
  internal-delegation:
    # Base64-encoded PKCS8 key held only by the Admin issuer.
    private-key: ${INTERNAL_DELEGATION_PRIVATE_KEY:}
    key-id: ${INTERNAL_DELEGATION_KEY_ID:}
    # Bootstrap uses a separate one-shot signing key.
    bootstrap-private-key: ${BOOTSTRAP_DELEGATION_PRIVATE_KEY:}
    bootstrap-key-id: ${BOOTSTRAP_DELEGATION_KEY_ID:}
    issuer: ${INTERNAL_DELEGATION_ISSUER:backend-admin}
    audience: ${INTERNAL_DELEGATION_AUDIENCE:backend-app}
    ttl-seconds: ${INTERNAL_DELEGATION_TTL_SECONDS:30}

dubbo:
  application:
    name: ${DUBBO_APPLICATION_NAME:backend-admin}
    register-mode: instance
    qos-enable: false
    protocol: tri
    metadata-type: local
  protocol:
    name: tri
    ssl-enabled: ${DUBBO_PROTOCOL_SSL_ENABLED:false}
    # bootstrap (up.sh) 以 DUBBO_PROTOCOL_PORT=-1 随机端口运行, 避免与
    # PM2 ulticode-admin (20882) 或残留的 bootstrap JVM 抢端口。
    port: ${DUBBO_PROTOCOL_PORT:20882}
    triple:
      max-requests-per-connection: 50
  ssl:
    default: ${DUBBO_SSL_DEFAULT:false}
    server-key-cert-chain-path: ${DUBBO_SSL_SERVER_KEY_CERT_CHAIN_PATH:}
    server-private-key-path: ${DUBBO_SSL_SERVER_PRIVATE_KEY_PATH:}
    server-trust-cert-collection-path: ${DUBBO_SSL_SERVER_TRUST_CERT_COLLECTION_PATH:}
    client-key-cert-chain-path: ${DUBBO_SSL_CLIENT_KEY_CERT_CHAIN_PATH:}
    client-private-key-path: ${DUBBO_SSL_CLIENT_PRIVATE_KEY_PATH:}
    client-trust-cert-collection-path: ${DUBBO_SSL_CLIENT_TRUST_CERT_COLLECTION_PATH:}
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:${NACOS_PORT:28848}?namespace=${DUBBO_NAMESPACE:dev}}
    username: ${DUBBO_REGISTRY_USERNAME:${ADMIN_NACOS_USERNAME:}}
    password: ${DUBBO_REGISTRY_PASSWORD:${ADMIN_NACOS_PASSWORD:}}
    timeout: 5000
    use-as-config-center: true
    use-as-metadata-center: true
    parameters:
      namespace: ${DUBBO_NAMESPACE:dev}
      group: DEFAULT_GROUP
  scan:
    base-packages: com.ulticode.admin.dubbo.provider
  consumer:
    check: false
    # P4-RPC-002: §6.4 global consumer defaults — fail-safe for writes.
    # Default is the WRITE boundary: retries=0 (no auto-retry, prevents
    # double-apply on mutating RPCs) + timeout=3000ms (write upper bound).
    # Query RPCs MUST override per-reference:
    #   @DubboReference(timeout=RpcPolicy.QUERY_TIMEOUT_MS, retries=RpcPolicy.QUERY_RETRIES)
    # Rationale: a write RPC that accidentally inherits retry=1 can
    # double-apply a side effect (critical correctness bug); a query RPC
    # that inherits retry=0 is merely conservative (safe, suboptimal).
    timeout: 3000
    retries: 0
    # Signed caller identity is verified by backend-app before privileged writes.
    filter: default,delegationAssertionConsumer
  provider:
    filter: default
  cloud:
    subscribed-services: ''

logging:
  level:
    root: INFO
    com.ulticode: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]"

jwt:
  resource-server:
    enabled: true
  secret: ${JWT_SECRET:}
  expected-issuer: ${JWT_EXPECTED_ISSUER:ulticode-auth}
  expected-audience: ${JWT_EXPECTED_AUDIENCE:ulticode-api}
  allowed-algorithms: ${JWT_ALLOWED_ALGORITHMS:HS256,RS256}
  clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:30}
  rsa:
    enabled: ${JWT_RSA_ENABLED:false}
  jwks-uri: ${JWT_JWKS_URI:http://localhost:9101/auth/jwks}
  jwks-json: ${JWT_JWKS_JSON:}
  jwks:
    cache-ttl-seconds: ${JWT_JWKS_CACHE_TTL_SECONDS:900}
    retry-backoff-seconds: ${JWT_JWKS_RETRY_BACKOFF_SECONDS:30}
    stale-if-error-seconds: ${JWT_JWKS_STALE_IF_ERROR_SECONDS:300}
    http-timeout-ms: ${JWT_JWKS_HTTP_TIMEOUT_MS:800}
    allowed-hosts: ${JWT_JWKS_ALLOWED_HOSTS:localhost,127.0.0.1,::1,backend-auth}

# Gateway topology smoke test (used by scripts/test/gateway-baseline.sh).
#
# Mirrors docker-compose.prod.yml's wiring at the network layer: the gateway
# resolves backend-auth/backend-admin/backend-app via Docker DNS exactly as the
# production frontend containers do. Each owner is a deterministic echo
# backend on its production internal HTTP port.
#
# Usage (called by the script — don't run directly):
#   docker compose -f docker-compose.gateway-test.yml up -d
#   docker compose -f docker-compose.gateway-test.yml down
#
# The gateway port is published on loopback only. Backend ports are NOT
# published.
services:
  backend-auth:
    image: python:3.12-alpine
    container_name: gateway-test-backend-auth
    working_dir: /opt
    command:
      - sh
      - -c
      - "python3 fake-backend.py 9101"
    volumes:
      - ./infrastructure/nginx/fake-backend.py:/opt/fake-backend.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/_probe')"]
      interval: 1s
      timeout: 1s
      retries: 30
    networks:
      - gw-net

  backend-admin:
    image: python:3.12-alpine
    container_name: gateway-test-backend-admin
    working_dir: /opt
    command:
      - sh
      - -c
      - "python3 fake-backend.py 9102"
    volumes:
      - ./infrastructure/nginx/fake-backend.py:/opt/fake-backend.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/_probe')"]
      interval: 1s
      timeout: 1s
      retries: 30
    networks:
      - gw-net

  backend-app:
    image: python:3.12-alpine
    container_name: gateway-test-backend-app
    working_dir: /opt
    command:
      - sh
      - -c
      - "python3 fake-backend.py 9103"
    volumes:
      - ./infrastructure/nginx/fake-backend.py:/opt/fake-backend.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9103/_probe')"]
      interval: 1s
      timeout: 1s
      retries: 30
    networks:
      - gw-net

  gateway:
    image: nginx:1.27-alpine
    container_name: gateway-test-frontend
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      backend-auth:
        condition: service_healthy
      backend-admin:
        condition: service_healthy
      backend-app:
        condition: service_healthy
    volumes:
      # Render the shared security headers under the include path expected by
      # console/nginx.conf; the template is static but follows nginx's normal
      # envsubst layout.
      - ./console/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./infrastructure/nginx/includes/security-headers.conf:/etc/nginx/templates/includes/security-headers.conf.template:ro
      # backend-proxy.conf has no env vars; mount it directly.
      - ./infrastructure/nginx/includes/backend-proxy.conf:/etc/nginx/conf.d/includes/backend-proxy.conf:ro
    networks:
      - gw-net

networks:
  gw-net:
    driver: bridge

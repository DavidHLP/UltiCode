name: Frontend

on:
  workflow_call:
    inputs:
      console_changed:
        description: Console app or shared package changed
        required: true
        type: boolean
      management_changed:
        description: Management app or shared package changed
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  application:
    name: Verify (${{ matrix.app }})
    if: ${{ inputs.console_changed || inputs.management_changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.console_changed && inputs.management_changed && '["console","management"]' || inputs.console_changed && '["console"]' || '["management"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup-frontend
      - name: Read-only lint
        working-directory: apps/${{ matrix.app }}
        run: pnpm lint:check
      - name: Type check
        working-directory: apps/${{ matrix.app }}
        run: pnpm type-check
      - name: Unit tests and coverage
        working-directory: apps/${{ matrix.app }}
        run: pnpm test:coverage
      - name: Audit production dependencies
        working-directory: apps/${{ matrix.app }}
        run: pnpm audit --prod --audit-level high
      - name: Production build
        working-directory: apps/${{ matrix.app }}
        run: pnpm build
      - name: Check management translations
        if: ${{ matrix.app == 'management' }}
        working-directory: apps/management
        run: pnpm check:i18n --json && pnpm vitest run -- src/i18n/__tests__/
      - name: Preserve coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.app }}
          path: apps/${{ matrix.app }}/coverage/
          retention-days: 14
          if-no-files-found: warn

  shared-packages:
    name: Verify shared packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup-frontend
      - name: Type check packages
        run: pnpm --recursive --filter './packages/*' --if-present type-check
      - name: Test packages
        run: pnpm --recursive --filter './packages/*' --filter '!./packages/auth-core' --if-present test
      - name: Auth coverage
        run: pnpm --dir packages/auth-core test:coverage
      - name: Preserve auth coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-auth-core
          path: packages/auth-core/coverage/
          retention-days: 14
          if-no-files-found: warn

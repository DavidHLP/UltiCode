version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "automated"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"

  - package-ecosystem: "npm"
    directory: "/apps/console"
    schedule:
      interval: "weekly"
    groups:
      console-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      console-development:
        dependency-type: "development"
    labels:
      - "dependencies"
      - "automated"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    # TypeScript 7 moved the compiler entry points this toolchain still relies
    # on: vue-tsc resolves typescript/lib/tsc, which the package no longer
    # exports, and @typescript-eslint/typescript-estree crashes reading the
    # compiler enums. Both `lint:check` and `type-check` therefore fail before
    # any project code is checked. Hold the major until vue-tsc and
    # typescript-eslint ship TypeScript 7 support.
    #
    # Tradeoff: Dependabot applies `ignore` to security updates too, so
    # TypeScript stops receiving security PRs here; watch advisories against the
    # 6.x line manually and lift the rule once the toolchain supports 7.
    #
    # @vue-dnd-kit/core 2.x is a full API replacement (DnDProvider +
    # makeDraggable/makeDroppable/makeSelectionArea; the 1.x useDraggable/
    # useDroppable composable are gone). Its only consumer, LayoutPanelHeader,
    # has no tests, so the 1.7 -> 2.4 jump (PR #177) type-checks only after a
    # deliberate port with provider wiring and regression tests. Held by
    # version constraint, same as the @dnd-kit hold below.
    #
    # markdown-it 15 is not adoptable as a bump: it imports the *named*
    # `LinkifyIt` export (`dist/markdown-it.mjs:5`), which linkify-it only
    # provides from 6.0.0, while `pnpm-workspace.yaml` overrides linkify-it to
    # ^5.0.2. A pnpm override rewrites every matching edge unconditionally and
    # does not fail, so syncing the root lockfile would install linkify-it 5
    # under markdown-it 15 and `packages/markdown-utils` would throw as soon as
    # it constructs MarkdownIt. The migration also owns `packages/markdown-utils`
    # (the only real importer, invisible to these two app blocks) and
    # `packages/design-system`'s KaTeX CSS, because @mdit/plugin-katex 1.1.1
    # pulls katex ^0.18.6 and 0.18 renamed 16 internal CSS classes. Checklist in
    # #200; PRs #191/#195 closed. GHSA-6v5v-wf23-fmfq is already fixed by the
    # held 14.3.2, so this rule suppresses no security PR today - 15.0.1/15.0.2
    # harden the linkify rules that `linkify: true` enables.
    #
    # @vueuse/core 15 removes only `templateRef`, none of the 12 composables this
    # repo imports. The blocker is the graph: reka-ui still declares
    # `@vueuse/core: ^14.1.0` as a regular dependency and packages/design-system
    # declares ^14.1.0 and is consumed as source by both apps, so an app-only
    # bump adds a third copy for no API gain. Lift when reka-ui accepts ^15,
    # moving packages/design-system in the same change. PRs #194/#196 closed.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vue-dnd-kit/core"
        versions: [">=2.0.0"]
      - dependency-name: "markdown-it"
        versions: [">=15.0.0"]
      - dependency-name: "@vueuse/core"
        versions: [">=15.0.0"]

  - package-ecosystem: "npm"
    directory: "/apps/management"
    schedule:
      interval: "weekly"
    groups:
      management-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      management-development:
        dependency-type: "development"
    labels:
      - "dependencies"
      - "automated"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    # Coordinated migrations, not version bumps (same policy as the Spring Boot
    # 4 holds below). Same-line updates still apply.
    #
    # @dnd-kit/abstract and @dnd-kit/dom 0.5 rewrite the activation-constraint
    # options and swap the manager types. The only Vue adapter,
    # dnd-kit-vue@0.0.2, is pinned to the 0.1.x line, so a 0.5 bump leaves
    # DataTable on a different generation than the adapter that drives it. Lift
    # these two when the adapter moves to @dnd-kit/vue.
    # Held by version constraint, not update-types: Dependabot classifies
    # 0.1.21 -> 0.5.0 numerically as a minor bump, so a semver-major ignore
    # never matches (PR #170 slipped through the old rule for exactly this).
    #
    # @tanstack/vue-table 9 is an API rewrite (useTable plus explicit
    # tableFeatures, row-model slots, atom state, and a TFeatures type
    # parameter) that reaches DataTable, DraggableRow and every column
    # definition. Migrate deliberately, then lift this rule.
    #
    # zod 4 breaks @vee-validate/zod (peer `zod ^3.24`), which every management
    # form schema uses through toTypedSchema; console already runs zod 4 because
    # it never depended on @vee-validate/zod. Lift this rule when a
    # @vee-validate/zod release supports zod 4 (PR #183).
    #
    # markdown-it 15 and @vueuse/core 15: same holds as the console entry above
    # (checklist in #200, PRs #195/#196 closed).
    #
    # Tradeoff: Dependabot applies `ignore` to security updates and to version
    # updates, so these artifacts also stop receiving security update PRs.
    # Watch advisories against the held lines manually and lift the matching
    # rule when one lands.
    ignore:
      # Same TypeScript 7 toolchain hold as the console entry above.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@dnd-kit/abstract"
        versions: [">=0.2.0"]
      - dependency-name: "@dnd-kit/dom"
        versions: [">=0.2.0"]
      - dependency-name: "@tanstack/vue-table"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        versions: [">=4.0.0"]
      - dependency-name: "markdown-it"
        versions: [">=15.0.0"]
      - dependency-name: "@vueuse/core"
        versions: [">=15.0.0"]

  - package-ecosystem: "maven"
    directory: "/services"
    schedule:
      interval: "weekly"
    groups:
      all-maven:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "automated"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    # Spring Boot 4 / Spring Framework 7 is a coordinated migration (renamed
    # starters, Jackson 3, moved auto-configuration packages, and a Dubbo line
    # with no Boot 4 support), not a version bump. Hold the Boot-4-line
    # artifacts here; same-line patch and minor releases still apply.
    #
    # Tradeoff: Dependabot applies `ignore` to version updates and to security
    # updates, so these three artifacts will also stop receiving security
    # update PRs. Watch advisories against Boot 3.5.x, testcontainers 1.21.x
    # and springdoc 2.x manually and lift the matching rule when one lands.
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.testcontainers:testcontainers-bom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        update-types: ["version-update:semver-major"]

# Development Profile Configuration

# CORS Configuration for Development
cors:
  allowed-origins: http://localhost:9002,http://localhost:9003,http://127.0.0.1:9002,http://127.0.0.1:9003

server:
  port: ${SERVER_PORT:9001}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:23306}/${DB_NAME:ulticode}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:ulticode}
    password: ${DB_PASSWORD:ulticode}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:}
      database: 0

# JWT Configuration for Development
jwt:
  secret: ${JWT_SECRET}
  cookie:
    accessToken:
      secure: false  # Disable secure flag for local development (HTTP)
    refreshToken:
      secure: false  # Disable secure flag for local development (HTTP)

# MyBatis-Plus Development Settings
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# SpringDoc Development Settings
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Verbose Logging for Development
logging:
  level:
    com.ulticode: DEBUG
    com.baomidou.mybatisplus: DEBUG
    org.springframework.web: DEBUG

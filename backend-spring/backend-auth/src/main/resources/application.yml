server:
  port: ${SERVER_PORT:9101}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9002,http://localhost:9003}

spring:
  application:
    name: backend-auth
  main:
    allow-bean-definition-overriding: true

  # Redisson Configuration (distributed locks, OAuth state, CSRF nonce)
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:26379}"
          password: ${REDIS_PASSWORD:}
          database: ${REDIS_DB:0}
          connectionPoolSize: 64
          connectionMinimumIdleSize: 10

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:23306}/${DB_NAME:ulticode}?useUnicode=true&characterEncoding=UTF-8&characterSetResults=utf8mb4&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&useDBAuthPlugin=mysql_native_password
    username: ${DB_USER:auth_rw}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # Flyway Configuration - shared migrations live in init-db/migrations/
  flyway:
    enabled: true
    locations: filesystem:${FLYWAY_MIGRATIONS_DIR:../init-db/migrations},filesystem:${FLYWAY_MIGRATIONS_DIR:../init-db/migrations/auth}
    baseline-on-migrate: true
    baseline-version: 20260322
    baseline-description: Initial baseline
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true

  # Email Configuration (password reset + security notifications)
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  # Issuer claim (iss) stamped onto every access and refresh token. Must match
  # jwt.expected-issuer in backend-app and backend-admin application.yml.
  issuer: ${JWT_ISSUER:ulticode-auth}
  access-token:
    expiration: 900000 # 15 minutes in milliseconds
  refresh-token:
    expiration: 604800000 # 7 days in milliseconds
  cookie:
    access-token:
      name: access_token
      http-only: true
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: lax
      path: /
      max-age: 900 # 15 minutes in seconds
    refresh-token:
      name: refresh_token
      http-only: true
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: lax
      path: /
      max-age: 604800 # 7 days in seconds

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ulticode.auth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: input

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 5s

# P1-INFRA-003: Dubbo 3.3.6 + Nacos registry.
dubbo:
  application:
    name: ${DUBBO_APPLICATION_NAME:backend-auth}
    register-mode: instance
    qos-enable: false
    protocol: tri
    metadata-type: local
  protocol:
    name: tri
    port: 20881
    triple:
      max-requests-per-connection: 50
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:${NACOS_PORT:28848}?namespace=${DUBBO_NAMESPACE:dev}}
    username: ${DUBBO_REGISTRY_USERNAME:}
    password: ${DUBBO_REGISTRY_PASSWORD:}
    timeout: 5000
    # P1-INFRA-003: register-mode=instance 下 provider 必须把 interface→application
    # 映射发布到 metadata/config center, 否则消费方解析不到实例
    # ("No provider available ... invokers: 0[]")。与 backend-app/backend-admin 保持一致。
    use-as-config-center: true
    use-as-metadata-center: true
    parameters:
      namespace: ${DUBBO_NAMESPACE:dev}
      group: DEFAULT_GROUP
  scan:
    base-packages: com.ulticode.auth.dubbo.provider
  consumer:
    check: false
    # P4-RPC-002: §6.4 global consumer defaults — fail-safe for writes.
    # Default is the WRITE boundary: retries=0 (no auto-retry, prevents
    # double-apply on mutating RPCs) + timeout=3000ms (write upper bound).
    # Query RPCs MUST override per-reference:
    #   @DubboReference(timeout=RpcPolicy.QUERY_TIMEOUT_MS, retries=RpcPolicy.QUERY_RETRIES)
    # Rationale: a write RPC that accidentally inherits retry=1 can
    # double-apply a side effect (critical correctness bug); a query RPC
    # that inherits retry=0 is merely conservative (safe, suboptimal).
    timeout: 3000
    retries: 0
  provider:
    filter: default
  cloud:
    subscribed-services: ''

# App-specific configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:9002}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from-name: ${EMAIL_FROM_NAME:UltiCode}

logging:
  level:
    root: INFO
    com.ulticode: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]"

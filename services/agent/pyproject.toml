[project]
name = "ulticode-agent"
version = "0.1.0"
description = "Standalone Python Agent analysis and learning-plan workflow for UltiCode"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "mcp>=2.3.0,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

      (-A..-G) moved Auth ownership into backend-auth; P2-RBAC-001 landed the owner-only write surface (RoleAdministrationService
      + UserRoleMapper in backend-auth) and routed every legacy admin write through BackendAuthRoleAdminClient; the legacy

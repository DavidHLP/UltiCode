server:
  port: ${SERVER_PORT:9103}
  shutdown: graceful

spring:
  application:
    name: backend-app
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:45s}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  # P7-MIGRATE-PROBLEM-001: enable datasource for problem domain
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${APP_DB_HOST}:${APP_DB_PORT}/${APP_DB_NAME}?useUnicode=true&characterEncoding=UTF-8&characterSetResults=utf8mb4&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&useAffectedRows=true
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: app-scheduled-
      shutdown:
        await-termination: true
        await-termination-period: ${SPRING_TASK_SCHEDULING_SHUTDOWN_AWAIT_TERMINATION_PERIOD:45s}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ulticode.app.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: input

app:
  runtime:
    # HTTP/API is the default App role after judge extraction. The independent
    # backend-judge runtime is the only role allowed to poll judge queues.
    role: ${APP_RUNTIME_ROLE:api}
    # Supported local launcher default. dev-full overrides this through the
    # manifest; production Compose must declare its indexed/remote mode.
    mode: ${APP_RUNTIME_MODE:dev-lite}
  search:
    read:
      # dev-lite is deterministic DB read; indexed mode is explicit and
      # requires the event-backed Search worker/Meili path.
      # Direct App boot follows the same deterministic default as dev-lite.
      # Indexed mode is an explicit launcher/Compose capability.
      mode: ${APP_SEARCH_READ_MODE:database}
      fallback-to-database: ${APP_SEARCH_FALLBACK_TO_DATABASE:false}
      worker-enabled: ${SEARCH_WORKER_ENABLED:}
    backfill:
      # SEARCH-003 backfill runner (DEC-017). Off by default; the runner bean
      # only exists when both this flag and meilisearch.enabled are true.
      enabled: ${APP_SEARCH_BACKFILL_ENABLED:false}
      # Comma-separated index selection; blank = all four (problems,users,posts,solutions).
      indexes: ${APP_SEARCH_BACKFILL_INDEXES:}
      page-size: 500
  audit:
    outbox:
      dispatcher:
        enabled: ${APP_AUDIT_OUTBOX_DISPATCHER_ENABLED:true}
        interval-ms: ${APP_AUDIT_OUTBOX_DISPATCHER_INTERVAL_MS:2000}
  monitoring:
    # P7-RELOCATE-MONITORING-001: slow-query threshold for SqlTimingInterceptor
    # + /monitoring/database.slowQueries (moved from backend-legacy application.yml).
    slow-query-ms: 500

  storage:
    # Binary-storage seam (FileStoragePort) for user-uploaded state such as
    # avatars. local (default) preserves the legacy uploads/ directory behavior;
    # s3 pushes blobs to an S3-compatible object store shared by all App
    # replicas, which is what unblocks horizontal scaling of the App service.
    type: ${APP_STORAGE_TYPE:local}
    local:
      # Root directory for locally stored objects; relative paths resolve
      # against the process working directory.
      root-dir: ${APP_STORAGE_LOCAL_ROOT_DIR:uploads}
      # URL prefix returned to clients; must stay aligned with how local files
      # are served (legacy /uploads/avatars/... contract is unchanged).
      public-url-prefix: ${APP_STORAGE_PUBLIC_URL_PREFIX:/uploads}
    s3:
      # Path-style endpoint ({endpoint}/{bucket}/{key}); MinIO and AWS S3 both work.
      endpoint: ${APP_STORAGE_S3_ENDPOINT:}
      region: ${APP_STORAGE_S3_REGION:us-east-1}
      bucket: ${APP_STORAGE_S3_BUCKET:}
      access-key: ${APP_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${APP_STORAGE_S3_SECRET_KEY:}
      # Optional public base URL returned to clients (CDN/fronting host);
      # defaults to {endpoint}/{bucket}.
      public-base-url: ${APP_STORAGE_S3_PUBLIC_BASE_URL:}
      connect-timeout-ms: ${APP_STORAGE_S3_CONNECT_TIMEOUT_MS:10000}
      request-timeout-ms: ${APP_STORAGE_S3_REQUEST_TIMEOUT_MS:30000}
      max-concurrent-requests: ${APP_STORAGE_S3_MAX_CONCURRENT_REQUESTS:16}

  features:
    use-judge-outbox: ${APP_FEATURES_USE_JUDGE_OUTBOX:true}
    use-generation-fence: ${APP_FEATURES_USE_GENERATION_FENCE:true}
    judge-queue:
      use-port: ${APP_FEATURES_JUDGE_QUEUE_USE_PORT:true}
    judge-source:
      # Use legacy problem_examples as test cases (test_cases table has no data yet).
      # Switch to true after seeding test_cases for all problems.
      use-test-cases: ${JUDGE_USE_TEST_CASES:false}
  websocket:
    broadcast:
      # backend-notification publishes real-time notification/badge pushes on
      # the Redis channel consumed by this listener (NOTIFY-006). Default enabled
      # to preserve the pre-cutover local STOMP push behavior; the bridge falls
      # back to local push when Redis is unavailable.
      enabled: ${APP_WEBSOCKET_BROADCAST_ENABLED:true}

ulticode:
  app:
    inbox:
      # App retains only achievement, contest, and WebSocket inbox bindings.
      enabled: ${APP_INBOX_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 5s

security:
  internal-delegation:
    # Base64-encoded X509 public key; App never receives Admin private material.
    public-key: ${INTERNAL_DELEGATION_PUBLIC_KEY:}
    key-id: ${INTERNAL_DELEGATION_KEY_ID:}
    issuer: ${INTERNAL_DELEGATION_ISSUER:backend-admin}
    audience: ${INTERNAL_DELEGATION_AUDIENCE:backend-app}

dubbo:
  application:
    name: ${DUBBO_APPLICATION_NAME:backend-app}
    register-mode: instance
    qos-enable: false
    protocol: tri
    metadata-type: local
  protocol:
    name: tri
    ssl-enabled: ${DUBBO_PROTOCOL_SSL_ENABLED:false}
    port: 20883
    triple:
      max-requests-per-connection: 50
  ssl:
    default: ${DUBBO_SSL_DEFAULT:false}
    server-key-cert-chain-path: ${DUBBO_SSL_SERVER_KEY_CERT_CHAIN_PATH:}
    server-private-key-path: ${DUBBO_SSL_SERVER_PRIVATE_KEY_PATH:}
    server-trust-cert-collection-path: ${DUBBO_SSL_SERVER_TRUST_CERT_COLLECTION_PATH:}
    client-key-cert-chain-path: ${DUBBO_SSL_CLIENT_KEY_CERT_CHAIN_PATH:}
    client-private-key-path: ${DUBBO_SSL_CLIENT_PRIVATE_KEY_PATH:}
    client-trust-cert-collection-path: ${DUBBO_SSL_CLIENT_TRUST_CERT_COLLECTION_PATH:}
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:${NACOS_PORT:28848}?namespace=${DUBBO_NAMESPACE:dev}}
    username: ${DUBBO_REGISTRY_USERNAME:${APP_NACOS_USERNAME:}}
    password: ${DUBBO_REGISTRY_PASSWORD:${APP_NACOS_PASSWORD:}}
    timeout: 5000
    use-as-config-center: true
    use-as-metadata-center: true
    parameters:
      namespace: ${DUBBO_NAMESPACE:dev}
      group: DEFAULT_GROUP
  scan:
    base-packages: com.ulticode.app
  consumer:
    version: 1.0.0
    check: false
    # P4-RPC-002: §6.4 global consumer defaults — fail-safe for writes.
    # Default is the WRITE boundary: retries=0 (no auto-retry, prevents
    # double-apply on mutating RPCs) + timeout=3000ms (write upper bound).
    # Query RPCs MUST override per-reference:
    #   @DubboReference(timeout=RpcPolicy.QUERY_TIMEOUT_MS, retries=RpcPolicy.QUERY_RETRIES)
    # Rationale: a write RPC that accidentally inherits retry=1 can
    # double-apply a side effect (critical correctness bug); a query RPC
    # that inherits retry=0 is merely conservative (safe, suboptimal).
    timeout: 3000
    retries: 0
  provider:
    filter: default
  cloud:
    subscribed-services: ''

logging:
  level:
    root: INFO
    com.ulticode: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]"

# Code Execution Sandbox Configuration (P7-RELOCATE: moved from
# backend-legacy application.yml). Without this block,
# DockerSandboxConfig.seccompProfilePath() is null and
# SandboxExecutorImpl.resolveSeccompProfileDirectoryPath() NPEs on
# /problems/{id}/submissions/run.
code-execution:
  sandbox:
    enabled: ${SANDBOX_ENABLED:false}
    image: ${SANDBOX_IMAGE:ulticode-sandbox:latest}
    memory: ${SANDBOX_MEMORY:256m}
    cpus: ${SANDBOX_CPUS:1.0}
    timeout: ${SANDBOX_TIMEOUT:10}
    pids-limit: ${SANDBOX_PIDS_LIMIT:128}
    seccomp-profile-path: ${SANDBOX_SECCOMP_PROFILE:docker/sandbox/seccomp-profile.json}
    d-form:
      enabled: ${SANDBOX_DFORM_ENABLED:true}
      harness-root: ${SANDBOX_DFORM_HARNESS_ROOT:/opt/harness}
    languages:
      java:
        timeout-seconds: 10
        memory: 256m
      python:
        timeout-seconds: 5
        memory: 128m
      c:
        timeout-seconds: 5
        memory: 128m
      cpp:
        timeout-seconds: 5
        memory: 128m

# MeiliSearch Configuration (optional - for full-text search).
# P7-SEARCH-RELOCATE-001: moved from backend-legacy with the search
# family; SearchController lives in backend-app now.
meilisearch:
  enabled: ${MEILISEARCH_ENABLED:false}
  host: ${MEILI_HOST:http://localhost:7700}
  api-key: ${MEILI_MASTER_KEY:}

jwt:
  resource-server:
    enabled: true
  secret: ${JWT_SECRET:}
  expected-issuer: ${JWT_EXPECTED_ISSUER:ulticode-auth}
  expected-audience: ${JWT_EXPECTED_AUDIENCE:ulticode-api}
  allowed-algorithms: ${JWT_ALLOWED_ALGORITHMS:HS256,RS256}
  clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:30}
  rsa:
    enabled: ${JWT_RSA_ENABLED:false}
  jwks-uri: ${JWT_JWKS_URI:http://localhost:9101/auth/jwks}
  jwks-json: ${JWT_JWKS_JSON:}
  jwks:
    cache-ttl-seconds: ${JWT_JWKS_CACHE_TTL_SECONDS:900}
    retry-backoff-seconds: ${JWT_JWKS_RETRY_BACKOFF_SECONDS:30}
    stale-if-error-seconds: ${JWT_JWKS_STALE_IF_ERROR_SECONDS:300}
    http-timeout-ms: ${JWT_JWKS_HTTP_TIMEOUT_MS:800}
    allowed-hosts: ${JWT_JWKS_ALLOWED_HOSTS:localhost,127.0.0.1,::1,backend-auth}

name: CI Recommendation

on:
  push:
    branches: [main]
    paths:
      - 'recommendation/**'
      - '.github/workflows/ci-recommendation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Build all modules
        working-directory: recommendation
        run: mvn compile -B

      - name: Run tests
        working-directory: recommendation
        run: mvn test -B

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-recommendation
          path: recommendation/**/target/surefire-reports/
          retention-days: 7

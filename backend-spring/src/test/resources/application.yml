server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

spring:
  profiles:
    active: test

  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

  datasource:
    url: jdbc:mysql://localhost:23306/${DB_NAME:ulticode_test}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:ulticode}
    password: ${DB_PASSWORD:ulticode}

  data:
    redis:
      host: localhost
      port: 6379

# JWT test configuration - required for JwtProperties.validateSecret()
jwt:
  secret: test-jwt-secret-key-for-test-context-minimum-32-characters-long
  cookie:
    access-token:
      secure: false
    refresh-token:
      secure: false

# Logging
logging:
  level:
    root: WARN
    com.ulticode: INFO

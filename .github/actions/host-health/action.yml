name: 'Host health check'
description: >-
  Unified post-deploy health check over SSH. One line per service:
  "<container> <mode> <port> <path>" where mode is one of
  curl-container (curl inside the container), curl-host (curl from the host),
  inspect (require Docker healthcheck == healthy). "-" is a placeholder.
inputs:
  ssh_key:
    required: true
  host:
    required: true
  port:
    required: false
    default: '22'
  user:
    required: true
  services:
    description: 'Multiline service spec'
    required: false
    default: |
      # Readiness probes (review 2026-08-25 P0): verify DB + Redis, 503 on failure.
      backend-auth curl-container 9101 /api/v1/auth/health/ready
      backend-admin curl-container 9102 /api/v1/admin/health/ready
      backend-app curl-container 9103 /api/v1/app/health/ready
      backend-notification curl-container 9105 /api/v1/notification/health/ready
      backend-submission inspect - -
      backend-judge inspect - -
      console curl-host 9002 -
      management curl-host 9003 -
  attempts:
    description: 'Polls per service before failing'
    required: false
    default: '15'
  interval_seconds:
    required: false
    default: '5'
runs:
  using: 'composite'
  steps:
    - name: Install SSH key
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh_key }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

    - name: Check service health
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.user }}
        PORT: ${{ inputs.port }}
        ATTEMPTS: ${{ inputs.attempts }}
        INTERVAL: ${{ inputs.interval_seconds }}
        SERVICES: ${{ inputs.services }}
      run: |
        set -u
        SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${USER}@${HOST} -p ${PORT}"

        check_one() {
          local name="$1" mode="$2" port="$3" path_="$4"
          for i in $(seq 1 "${ATTEMPTS}"); do
            case "$mode" in
              curl-container)
                if $SSH_CMD "docker exec ulticode-$name curl -sf 'http://localhost:$port$path_' > /dev/null 2>&1"; then return 0; fi ;;
              curl-host)
                if $SSH_CMD "curl -sf http://localhost:$port > /dev/null 2>&1"; then return 0; fi ;;
              inspect)
                if $SSH_CMD "test \"\$(docker inspect -f '{{.State.Health.Status}}' ulticode-$name 2>/dev/null)\" = healthy"; then return 0; fi ;;
              *)
                echo "::error::unknown health mode '$mode' for $name"; return 1 ;;
            esac
            if [ "$i" -eq "${ATTEMPTS}" ]; then
              echo "::error::$name failed health check after $((ATTEMPTS * INTERVAL)) seconds"
              return 1
            fi
            echo "  Waiting for $name... ($i/${ATTEMPTS})"
            sleep "$INTERVAL"
          done
          return 1
        }

        failed=0
        while read -r name mode port path_; do
          [ -z "$name" ] && continue
          case "$name" in \#*) continue ;; esac
          echo "Checking $name..."
          if ! check_one "$name" "$mode" "$port" "$path_"; then
            failed=1
          else
            echo "  $name is healthy"
          fi
        done <<< "$SERVICES"

        exit $failed

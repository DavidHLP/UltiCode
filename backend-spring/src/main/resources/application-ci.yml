# CI Profile Configuration
# Used by: ./mvnw test -Dspring.profiles.active=ci
# Environment: GitHub Actions with services: containers (MySQL 9.1, Redis 7-alpine)
# Purpose: Replaces Testcontainers Docker lifecycle with GHA service containers

spring:
  datasource:
    url: jdbc:mysql://localhost:23306/${DB_NAME:ulticode_test}?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:ulticode}
    password: ${DB_PASSWORD:ulticode}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:}

  # Disable Testcontainers auto-configuration
  testcontainers:
    enabled: false

  # Flyway handles schema — do not let Hibernate modify schema
  jpa:
    hibernate:
      ddl-auto: none

  # Enable Flyway for CI migrations
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 0  # Random port for tests
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

# CORS: not needed in CI
cors:
  allowed-origins: ""

# JWT test configuration
jwt:
  secret: ${JWT_SECRET:test-jwt-secret-key-for-ci-minimum-32-characters-long}
  cookie:
    accessToken:
      secure: false
    refreshToken:
      secure: false

# Logging
logging:
  level:
    root: WARN
    com.ulticode: INFO

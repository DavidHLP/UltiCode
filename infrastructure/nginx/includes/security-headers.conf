# =============================================================================
# infrastructure/nginx/includes/security-headers.conf
#
# Canonical security-header block, included at server scope and at every
# location that would otherwise forget the inheritance (any `add_header`
# inside a `location` block causes the server-scope `add_header` chain to
# be DROPPED for that location — a classic nginx gotcha).
#
# This is the same set previously declared at server scope in
# console/nginx.conf and management/nginx.conf; the only difference is
# that it's now reusable, so the static-asset location can keep its
# `Cache-Control` directive AND inherit these headers via include.
# =============================================================================

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net data:; connect-src 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# The value is empty on HTTP and populated by the HTTPS map in the frontend
# gateway configs, so this include remains safe in the development profile.
add_header Strict-Transport-Security $strict_transport_security always;

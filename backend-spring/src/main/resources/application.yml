server:
  port: ${SERVER_PORT:9001}

spring:
  application:
    name: ulticode-backend

  # Redisson Configuration (distributed locks, queues)
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:26379}"
          password: ${REDIS_PASSWORD:}
          database: ${REDIS_DB:0}
          connectionPoolSize: 64
          connectionMinimumIdleSize: 10

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:23306}/${DB_NAME:ulticode}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:ulticode}
    password: ${DB_PASSWORD:ulticode}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  access-token:
    expiration: 900000  # 15 minutes in milliseconds
  refresh-token:
    expiration: 604800000  # 7 days in milliseconds
  cookie:
    access-token:
      name: access_token
      http-only: true
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: lax
      path: /
      max-age: 900  # 15 minutes in seconds
    refresh-token:
      name: refresh_token
      http-only: true
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: lax
      path: /
      max-age: 604800  # 7 days in seconds

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ulticode.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: input                    # 改为 input（UUID）

# SpringDoc Configuration
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Logging Configuration
logging:
  level:
    root: INFO
    com.ulticode: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# MeiliSearch Configuration (optional - for full-text search)
meilisearch:
  enabled: ${MEILISEARCH_ENABLED:false}
  host: ${MEILISEARCH_HOST:}
  api-key: ${MEILISEARCH_API_KEY:}

# Recommendation Service Configuration (optional - for personalized recommendations)
recommendation:
  enabled: ${RECOMMENDATION_ENABLED:false}
  service-url: ${RECOMMENDATION_SERVICE_URL:}
  timeout: ${RECOMMENDATION_TIMEOUT:5000}
  nacos-enabled: ${RECOMMENDATION_NACOS_ENABLED:false}
  fallback-url: ${RECOMMENDATION_FALLBACK_URL:}

# Code Execution Sandbox Configuration
code-execution:
  sandbox:
    enabled: ${SANDBOX_ENABLED:true}
    image: ${SANDBOX_IMAGE:ulticode-sandbox:latest}
    memory: ${SANDBOX_MEMORY:256m}
    cpus: ${SANDBOX_CPUS:1.0}
    timeout: ${SANDBOX_TIMEOUT:10}
    pids-limit: ${SANDBOX_PIDS_LIMIT:128}

# Backup Configuration
backup:
  dir: ${BACKUP_DIR:/tmp/backups}

# Email Configuration
spring.mail:
  host: ${SMTP_HOST:localhost}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USER:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

# App-specific configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:9002}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from-name: ${EMAIL_FROM_NAME:UltiCode}

# Management/Actuator Configuration
management:
  health:
    mail:
      enabled: false

# OAuth Configuration
oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:9001/auth/github/callback}
    authorize-url: https://github.com/login/oauth/authorize
    token-url: https://github.com/login/oauth/access_token
    user-url: https://api.github.com/user
    scopes: user:email

  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:9001/auth/google/callback}
    authorize-url: https://accounts.google.com/o/oauth2/v2/auth
    token-url: https://oauth2.googleapis.com/token
    user-url: https://www.googleapis.com/oauth2/v2/userinfo
    scopes: email,profile

# Dubbo Configuration (recommendation service consumer)
dubbo:
  application:
    name: ulticode-backend
    qos-enable: false
  registry:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:28848}
    parameters:
      namespace: public
      group: DEFAULT_GROUP
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  consumer:
    check: false
    timeout: 5000
    retries: 1

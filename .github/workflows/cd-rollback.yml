# Manual rollback to a previously published sha-<tag>. Verifies every image
# exists in GHCR first, then reuses the same host mechanics as cd-deploy
# (.github/actions/host-deploy with migrations skipped) and health checks.
name: CD Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to roll back to (e.g., sha-abc1234)'
        required: true
        type: string
      services:
        description: >-
          Services to roll back: 'all', or a comma/space-separated subset of
          backend-auth backend-admin backend-app backend-submission
          backend-notification backend-search backend-judge console management.
        required: true
        type: string
        default: 'all'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  packages: read

jobs:
  verify-tag:
    name: Verify image tag exists in GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check tag existence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.image_tag }}
          SELECTED: ${{ github.event.inputs.services }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.repository }}"
          ALL=("backend-auth" "backend-admin" "backend-app" "backend-submission" "backend-notification" "backend-judge" "console" "management")

          if [ -z "$SELECTED" ] || [ "$SELECTED" = "all" ]; then
            SERVICES=("${ALL[@]}")
          else
            SERVICES=()
            for SVC in $(printf '%s' "$SELECTED" | tr ',' ' ' | xargs); do
              OK=""
              for KNOWN in "${ALL[@]}"; do [ "$SVC" = "$KNOWN" ] && OK=1 && break; done
              if [ -z "$OK" ]; then
                echo "::error::Unknown service '${SVC}'. Valid: ${ALL[*]}"
                exit 1
              fi
              SERVICES+=("$SVC")
            done
          fi

          for SVC in "${SERVICES[@]}"; do
            echo "Checking ${SVC}:${TAG}..."
            RESPONSE=$(curl -sf -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/orgs/${OWNER}/packages/container/${REPO##*/}%2F${SVC}/versions?per_page=100" 2>/dev/null || echo "[]")

            if echo "$RESPONSE" | jq -r '.[].metadata.container.tags[]' 2>/dev/null | grep -qx "$TAG"; then
              echo "  Tag ${TAG} found for ${SVC}"
            else
              echo "::error::Tag ${TAG} not found in GHCR for ${SVC}. Available recent tags:"
              echo "$RESPONSE" | jq -r '.[].metadata.container.tags[]' 2>/dev/null | grep '^sha-' | head -10
              exit 1
            fi
          done
          echo "All service images verified for tag ${TAG}"

  rollback:
    name: Rollback to ${{ github.event.inputs.image_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-tag
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Roll back on host
        uses: ./.github/actions/host-deploy
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          user: ${{ secrets.DEPLOY_USER }}
          path: ${{ secrets.DEPLOY_PATH }}
          image_tag: ${{ github.event.inputs.image_tag }}
          services: ${{ github.event.inputs.services }}
          skip_migrations: 'true'
          registry: ghcr.io
          github_token: ${{ secrets.GITHUB_TOKEN }}
          actor: ${{ github.actor }}

      - name: Health check all services
        uses: ./.github/actions/host-health
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          user: ${{ secrets.DEPLOY_USER }}

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Rollback to ${{ github.event.inputs.image_tag }} failed. Check logs for details."

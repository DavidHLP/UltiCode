# Production Profile Configuration

# CORS Configuration for Production
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9002,http://localhost:9003}

server:
  port: ${SERVER_PORT:9001}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  cookie:
    access-token:
      secure: true
    refresh-token:
      secure: true

logging:
  level:
    com.ulticode: INFO
    org.springframework.security: WARN

# Manual deployment pipeline. Mechanics (SSH, migrations, sandbox prereqs,
# compose rollout) live in the shared .github/actions/host-deploy composite;
# health checking lives in .github/actions/host-health. Rollback reuses both.
name: CD Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      # Per-service rollout: any subset is pulled/up independently on the
      # host via host-deploy; 'all' keeps the previous whole-stack flow.
      services:
        description: 'Services to deploy'
        required: true
        type: choice
        options:
          - all
          - backend-auth
          - backend-admin
          - backend-app
          - backend-submission
          - backend-notification
          - backend-search
          - backend-judge
          - console
          - management
      skip_migrations:
        description: 'Skip database migrations'
        required: false
        type: boolean
        default: false
      image_tag:
        description: 'Default image tag for services without a per-service override'
        required: false
        type: string
        default: 'latest'
      service_tags:
        description: >-
          Optional per-service tag overrides, one NAME=value per line
          (e.g. BACKEND_AUTH_IMAGE_TAG=sha-abc1234). See docker-compose.prod.yml.
        required: false
        type: string
        default: ''

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to host
        id: deploy
        uses: ./.github/actions/host-deploy
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          user: ${{ secrets.DEPLOY_USER }}
          path: ${{ secrets.DEPLOY_PATH }}
          image_tag: ${{ github.event.inputs.image_tag || 'latest' }}
          services: ${{ github.event.inputs.services }}
          service_tags: ${{ github.event.inputs.service_tags }}
          skip_migrations: ${{ github.event.inputs.skip_migrations }}
          registry: ghcr.io
          github_token: ${{ secrets.GITHUB_TOKEN }}
          actor: ${{ github.actor }}
          db_host: ${{ secrets.DB_HOST }}
          db_port: ${{ secrets.DB_PORT }}
          db_name: ${{ secrets.DB_NAME }}
          db_user: ${{ secrets.DB_USER }}
          db_password: ${{ secrets.DB_PASSWORD }}

      - name: Health check all services
        uses: ./.github/actions/host-health
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          user: ${{ secrets.DEPLOY_USER }}

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Deployment to ${{ github.event.inputs.environment }} failed. Check logs for details."

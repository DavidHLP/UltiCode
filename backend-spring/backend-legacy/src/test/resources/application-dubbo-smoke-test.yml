# P1-INFRA-003: Dubbo-only smoke profile.
# Loaded by DubboBootstrapConfigTest. No DB / Redis / Mail / WebSocket.
# No real Nacos connection is required — the assertion is bean wiring.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketMessagingAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - org.springdoc.core.autoconfigure.SpringdocAutoConfiguration

# JWT so JwtProperties.validateSecret() does not fail
jwt:
  secret: test-only-jwt-signing-key-minimum-32-characters-long
  cookie:
    access-token:
      secure: false
    refresh-token:
      secure: false

# Dubbo 3.3.6 — Triple protocol + Nacos dev namespace.
# The host (127.0.0.1:8848) is a placeholder; the test only verifies
# that the registry bean binds with the expected URL form. The live
# registration check lives in scripts/dev/dubbo-nacos-smoke.sh.
dubbo:
  application:
    name: ulticode-backend-legacy
    register-mode: instance
    qos-enable: false
  protocol:
    name: tri
    port: -1
    triple:
      max-requests-per-connection: 50
  registry:
    address: nacos://127.0.0.1:8848?namespace=dev
    timeout: 5000
    parameters:
      namespace: dev
      group: DEFAULT_GROUP
    use-as-config-center: false
    use-as-metadata-center: false
  config-center:
    check: false
  metadata-report:
    check: false
  scan:
    base-packages: com.ulticode.dubbo.provider
  consumer:
    check: false
  provider:
    filter: default
  cloud:
    subscribed-services: ''

server:
  port: 0

logging:
  level:
    org.apache.dubbo: WARN
    com.alibaba.nacos: WARN
    com.ulticode: WARN

# P1-INFRA-005: test profile for service shell context-load tests.
# P7-MIGRATE-PROBLEM-001: exclude datasource/redis autoconfig in unit tests
# (context-load and shell smoke tests don't need real DB connections).
spring:
  profiles:
    active: test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

app:
  runtime:
    mode: dev-lite
  audit:
    outbox:
      dispatcher:
        enabled: false
  features:
    use-judge-outbox: true
    use-generation-fence: true
    judge-queue:
      use-port: true
  storage:
    type: s3
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: test
      access-key: test-access
      secret-key: test-secret
      tls-enabled: false
    startup-probe:
      enabled: false

dubbo:
  application:
    name: backend-app-test
  registry:
    address: multicast://224.5.6.7:1234
    register: false
    subscribe: true

management:
  health:
    redis:
      enabled: false
    db:
      enabled: false

# Flyway Configuration for New Seed Data (dev/test only)
# New seeds in migrations/seed/ are isolated from the shared chain.
# Legacy seeds (migrations/V20260603* etc.) remain on flyway.conf's
# filesystem:migrations/*.sql for backward compatibility — the incremental
# migrate path still scans them (already applied, not re-executed).
# True zero seed scan requires the fresh-install baseline path
# (init-db/baseline/baseline.sql), not this incremental seam.
flyway.locations=filesystem:migrations/*.sql,filesystem:migrations/seed
flyway.table=flyway_schema_history
flyway.baselineOnMigrate=false
flyway.validateOnMigrate=true

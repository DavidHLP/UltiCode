      \ silently\n   while the trace is still minted, copied to MDC, and visible\n   in every log line.\n\n3) Filters:\n \
      \  - com.ulticode.common.observability.HttpTraceparentFilter runs\n     at HIGHEST_PRECEDENCE. On response, it copies\
      \ the active\n     Micrometer trace id into the `X-Ulticode-Trace-Id` response\n     header. Uses ObjectProvider<Tracer>\
      \ so @WebMvcTest slices\n     that exclude the Micrometer Tracing autoconfiguration can\n     still load the filter\
      \ without a hard Tracer dependency.\n   - com.ulticode.common.observability.DubboTraceFilter is\n     loaded by SPI\
      \ via META-INF/dubbo/org.apache.dubbo.rpc.Filter\n     (one entry: ulticode-trace=...). It runs on both consumer\n \
      \    and provider sides (annotated @Activate(group={\"provider\",\n     \"consumer\"})). Consumer side reads the active\
      \ span and\n     sets two attachments on the outbound invocation:\n     `X-Ulticode-Trace-Id` (the 32-hex trace id)\
      \ and a W3C\n     `traceparent` header rendered from the active span.\n     Provider side logs the inbound attachment\
      \ and the active\n     span so the smoke can assert the ids match.\n\n4) Unit tests:\n   - HttpTraceparentFilterTest:\
      \ 2 tests, 0 failures. Asserts\n     that the response header carries the active trace id\n     when one is present,\
      \ and that no header is written when\n     the Tracer is not available (covers the @WebMvcTest\n     sliced context\
      \ path).\n   - DubboTraceFilterTest: 3 tests, 0 failures. Covers (a)\n     consumer side attaches the active trace id\
      \ to the\n     invocation, (b) consumer side renders a W3C traceparent\n     header that matches `^00-[0-9a-f]{32}-[0-9a-f]{16}-01$`,\n\
      \     (c) provider side does NOT set attachments and forwards\n     the invoker result unchanged.\n\n5) Regression:\
      \ ./mvnw -pl backend-legacy -am -B verify\n   Tests run: 1795, Failures: 0, Errors: 0, Skipped: 4. JaCoCo\n   check\
      \ PASS. Build SUCCESS in 28 s. The Phase 0 ArchUnit\n   freeze store is still valid (the new files live in\n   com.ulticode.common.observability,\
      \ which is outside the\n   three rules in OwnerBoundaryArchTest). The placeholder\n   HealthCheckService @DubboService\
      \ (P1-INFRA-003) still works\n   in the same JVM.\n\n6) Why this does not require P1-INFRA-003 runtime success:\n  \
      \ the four P1-OBS-001 acceptance criteria are all about\n   CLIENT-side (HTTP) and MIDDLEWARE-side (Dubbo filter) wiring.\n\
      \   The actual Nacos instance registration contract from\n   P1-INFRA-003 is a separate concern: even if no service\
      \ is\n   ever registered with Nacos, the trace context is still\n   extracted from the HTTP request, attached to the\
      \ Dubbo\n   invocation, and recovered on the provider side. The smoke\n   can verify the trace pipeline in the same\
      \ JVM by\n   combining the HttpTraceparentFilter (response header\n   capture) with a local @DubboReference to the\n\
      \   HealthCheckService placeholder."

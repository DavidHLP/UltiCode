name: 'Host deploy (SSH + compose)'
description: >-
  Shared deploy mechanics for cd-deploy/cd-rollback: install the SSH key,
  optionally run the ordered owner migration manifest, provision judge-sandbox prerequisites,
  then pull and `docker compose up` with the given image tag on the host,
  optionally restricted to a subset of services with per-service tags.
inputs:
  ssh_key:
    description: 'Private SSH key for the deploy host'
    required: true
  known_hosts:
    description: 'Environment-pinned known_hosts entries for the deploy host'
    required: true
  host:
    required: true
  port:
    required: false
    default: '22'
  user:
    required: true
  path:
    description: 'Deploy directory on the host'
    required: true
  image_tag:
    description: >-
      Default image tag applied to every service that has no per-service
      override (see service_tags).
    required: true
  services:
    description: >-
      Optional subset of compose services to pull and up (comma/space
      separated, e.g. "backend-auth backend-app"). Empty or "all" reconciles
      the whole stack.
    required: false
    default: ''
  service_tags:
    description: >-
      Optional newline-separated NAME=value exports applied on the host
      before compose runs, for per-service tags, e.g.
      "BACKEND_AUTH_IMAGE_TAG=sha-abc1234". Names must be valid shell env
      identifiers; values must not contain whitespace.
    required: false
    default: ''
  skip_migrations:
    description: '"true" skips the Flyway migrate step'
    required: false
    default: 'false'
  registry:
    required: false
    default: ghcr.io
  github_token:
    description: 'Token used to docker login to GHCR on the host'
    required: true
  actor:
    required: true
  migration_db_host:
    description: 'Privileged migration datasource host; required when migrations run'
    required: false
    default: ''
  migration_db_port:
    description: 'Privileged migration datasource port; required when migrations run'
    required: false
    default: ''
  migration_db_name:
    description: 'Shared migration database name; required when migrations run'
    required: false
    default: ''
  migration_db_user:
    description: 'Privileged migration account; never use an owner runtime account'
    required: false
    default: ''
  migration_db_password:
    description: 'Privileged migration account password'
    required: false
    default: ''
  submission_migration_db_user:
    description: 'Separate privileged Submission migration account'
    required: false
    default: ''
  submission_migration_db_password:
    description: 'Separate privileged Submission migration account password'
    required: false
    default: ''
  auth_db_user:
    description: 'Auth runtime account name used by migration preflight'
    required: false
    default: ''
  admin_db_user:
    description: 'Admin runtime account name used by migration preflight'
    required: false
    default: ''
  app_db_user:
    description: 'App runtime account name used by migration preflight'
    required: false
    default: ''
  notification_db_user:
    description: 'Notification runtime account name used by migration preflight'
    required: false
    default: ''
  submission_db_user:
    description: 'Submission runtime account name used by migration preflight'
    required: false
    default: ''
  migration_report_dir:
    description: 'Remote directory for machine and human migration reports'
    required: false
    default: '.local/migration-audit'
  migration_lock_file:
    description: 'Remote lock file used to serialize owner migration runs'
    required: false
    default: '.local/migration-audit/owner-migrations.lock'
runs:
  using: 'composite'
  steps:
    - name: Install SSH key
      shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.ssh_key }}
        DEPLOY_KNOWN_HOSTS: ${{ inputs.known_hosts }}
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail
        [[ -n "$DEPLOY_KEY" ]] || { echo "::error::deploy SSH key is empty" >&2; exit 1; }
        [[ -n "$DEPLOY_KNOWN_HOSTS" ]] || { echo "::error::deploy known_hosts is empty" >&2; exit 1; }
        install -d -m 700 ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
        host_lookup="$DEPLOY_HOST"
        [[ "$DEPLOY_PORT" == "22" ]] || host_lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"
        ssh-keygen -F "$host_lookup" -f ~/.ssh/known_hosts >/dev/null \
          || { echo "::error::known_hosts has no pinned key for $host_lookup" >&2; exit 1; }

    - name: Run ordered owner database migrations
      if: ${{ inputs.skip_migrations != 'true' }}
      shell: bash
      env:
        MIGRATION_DB_HOST: ${{ inputs.migration_db_host }}
        MIGRATION_DB_PORT: ${{ inputs.migration_db_port }}
        MIGRATION_DB_NAME: ${{ inputs.migration_db_name }}
        MIGRATION_DB_USER: ${{ inputs.migration_db_user }}
        MIGRATION_DB_PASSWORD: ${{ inputs.migration_db_password }}
        SUBMISSION_MIGRATION_DB_USER: ${{ inputs.submission_migration_db_user }}
        SUBMISSION_MIGRATION_DB_PASSWORD: ${{ inputs.submission_migration_db_password }}
        AUTH_DB_USER: ${{ inputs.auth_db_user }}
        ADMIN_DB_USER: ${{ inputs.admin_db_user }}
        APP_DB_USER: ${{ inputs.app_db_user }}
        NOTIFICATION_DB_USER: ${{ inputs.notification_db_user }}
        SUBMISSION_DB_USER: ${{ inputs.submission_db_user }}
        MIGRATION_REPORT_DIR: ${{ inputs.migration_report_dir }}
        MIGRATION_LOCK_FILE: ${{ inputs.migration_lock_file }}
      run: |
        set -euo pipefail
        for required in MIGRATION_DB_HOST MIGRATION_DB_PORT MIGRATION_DB_NAME \
          MIGRATION_DB_USER MIGRATION_DB_PASSWORD SUBMISSION_MIGRATION_DB_USER \
          SUBMISSION_MIGRATION_DB_PASSWORD AUTH_DB_USER ADMIN_DB_USER APP_DB_USER \
          NOTIFICATION_DB_USER SUBMISSION_DB_USER; do
          [[ -n "${!required}" ]] || { echo "::error::$required is required for owner migrations" >&2; exit 1; }
        done

        shell_quote() { printf '%q' "$1"; }
        SSH_CMD=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          "${{ inputs.user }}@${{ inputs.host }}" -p "${{ inputs.port }}")
        remote_command="cd $(shell_quote "${{ inputs.path }}") &&"
        remote_command+=" MIGRATION_DB_HOST=$(shell_quote "$MIGRATION_DB_HOST")"
        remote_command+=" MIGRATION_DB_PORT=$(shell_quote "$MIGRATION_DB_PORT")"
        remote_command+=" MIGRATION_DB_NAME=$(shell_quote "$MIGRATION_DB_NAME")"
        remote_command+=" MIGRATION_DB_USER=$(shell_quote "$MIGRATION_DB_USER")"
        remote_command+=" MIGRATION_DB_PASSWORD=$(shell_quote "$MIGRATION_DB_PASSWORD")"
        remote_command+=" SUBMISSION_MIGRATION_DB_USER=$(shell_quote "$SUBMISSION_MIGRATION_DB_USER")"
        remote_command+=" SUBMISSION_MIGRATION_DB_PASSWORD=$(shell_quote "$SUBMISSION_MIGRATION_DB_PASSWORD")"
        remote_command+=" AUTH_DB_NAME=auth AUTH_DB_USER=$(shell_quote "$AUTH_DB_USER")"
        remote_command+=" ADMIN_DB_NAME=admin ADMIN_DB_USER=$(shell_quote "$ADMIN_DB_USER")"
        remote_command+=" APP_DB_NAME=app APP_DB_USER=$(shell_quote "$APP_DB_USER")"
        remote_command+=" NOTIFICATION_DB_NAME=notification NOTIFICATION_DB_USER=$(shell_quote "$NOTIFICATION_DB_USER")"
        remote_command+=" SUBMISSION_DB_NAME=submission SUBMISSION_DB_USER=$(shell_quote "$SUBMISSION_DB_USER")"
        remote_command+=" OWNER_MIGRATION_REPORT_DIR=$(shell_quote "$MIGRATION_REPORT_DIR")"
        remote_command+=" OWNER_MIGRATION_LOCK_FILE=$(shell_quote "$MIGRATION_LOCK_FILE")"
        remote_command+=" ./scripts/runbooks/owner-migration-manifest.sh migrate"
        "${SSH_CMD[@]}" "$remote_command"

    - name: Provision sandbox prerequisites on host
      # The judge worker healthcheck requires the sandbox image and seccomp
      # profile to exist on the host; without this step a fresh host would
      # fail the whole deploy (and unrelated rollbacks) with no hint.
      # Idempotent, so rollback can safely reuse it.
      shell: bash
      run: |
        SSH_CMD="ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts ${{ inputs.user }}@${{ inputs.host }} -p ${{ inputs.port }}"
        $SSH_CMD "cd ${{ inputs.path }} && \
                  export SANDBOX_HOST_DIR=\"\${SANDBOX_HOST_DIR:-/opt/ulticode/sandbox}\" && \
                  sudo -n install -d -o 1000 -g 1000 \"\$SANDBOX_HOST_DIR/workspace\" && \
                  sudo -n install -o 1000 -g 1000 docker/sandbox/seccomp-profile.json \"\$SANDBOX_HOST_DIR/seccomp-profile.json\" && \
                  docker/sandbox/harness/build.sh && \
                  echo 'sandbox prerequisites ready'"

    - name: Pull and deploy services
      shell: bash
      run: |
        SSH_CMD="ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts ${{ inputs.user }}@${{ inputs.host }} -p ${{ inputs.port }}"

        # Login to GHCR on remote
        $SSH_CMD "echo ${{ inputs.github_token }} | docker login ${{ inputs.registry }} -u ${{ inputs.actor }} --password-stdin"

        # Build the remote export chain: global IMAGE_TAG plus any validated
        # per-service tag overrides (docker-compose.prod.yml resolves each
        # service as <SERVICE>_IMAGE_TAG -> IMAGE_TAG -> latest).
        EXPORTS="export IMAGE_TAG=${{ inputs.image_tag }}"
        TAG_LINES="${{ inputs.service_tags }}"
        while IFS= read -r pair; do
          pair="$(printf '%s' "$pair" | tr -d '[:space:]')"
          [ -z "$pair" ] && continue
          case "$pair" in
            *=*) ;;
            *) echo "::error::Invalid service_tags entry (missing '='): ${pair}" ; exit 1 ;;
          esac
          NAME="${pair%%=*}"
          VALUE="${pair#*=}"
          case "$NAME" in
            [A-Za-z_]*) ;;
            *) echo "::error::Invalid service_tags entry (bad name): ${pair}" ; exit 1 ;;
          esac
          case "$NAME" in
            *[!A-Za-z0-9_]*) echo "::error::Invalid service_tags entry (bad name): ${pair}" ; exit 1 ;;
          esac
          case "$VALUE" in
            *[!A-Za-z0-9_./:-]*) echo "::error::Invalid service_tags entry (bad value): ${VALUE}" ; exit 1 ;;
          esac
          EXPORTS="$EXPORTS && export $pair"
        done <<< "$TAG_LINES"

        # Optional selective rollout/rollback: restrict pull/up to an explicit
        # allowlisted subset instead of reconciling the whole stack.
        TARGETS=""
        if [ -n "${{ inputs.services }}" ] && [ "${{ inputs.services }}" != "all" ]; then
          for svc in $(printf '%s' "${{ inputs.services }}" | tr ',' ' ' | xargs); do
            case "$svc" in
              *[!A-Za-z0-9_.-]*) echo "::error::Invalid service name: ${svc}" ; exit 1 ;;
            esac
            TARGETS="$TARGETS $svc"
          done
        fi

        # Pull and deploy with the tag exports in the same remote shell session;
        # empty TARGETS keeps the previous whole-stack behaviour.
        $SSH_CMD "cd ${{ inputs.path }} && $EXPORTS && \
                  docker compose -f docker-compose.yml -f docker-compose.prod.yml pull$TARGETS && \
                  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans$TARGETS"

# Explicit P1-DATA-001 owner-schema contraction history.
# This location is deliberately separate from the normal shared/Owner chains;
# only the confirmation-gated contraction runbook invokes it.
flyway.locations=filesystem:migrations/contraction
flyway.defaultSchema=ulticode
# Use a dedicated history because this location is not part of ordinary
# startup. The explicit contract command baselines this history immediately
# before the contraction migration; it never changes the shared history.
flyway.table=flyway_contraction_history
flyway.createSchemas=false
flyway.baselineOnMigrate=true
flyway.baselineVersion=20260830200000
flyway.baselineDescription=P1-DATA-001 owner contraction precondition
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql
flyway.encoding=UTF-8
flyway.outOfOrder=false
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
flyway.placeholderReplacement=true
flyway.placeholders.contraction_confirmed=false
flyway.placeholders.backup_confirmed=false
flyway.placeholders.quiesce_confirmed=false
flyway.placeholders.app_db_user=app_rw
flyway.placeholders.app_db_host=%

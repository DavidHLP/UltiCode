server:
  port: ${NOTIFICATION_SERVER_PORT:9105}
  shutdown: graceful

spring:
  application:
    name: backend-notification
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:45s}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${NOTIFICATION_DB_URL:jdbc:mysql://${NOTIFICATION_DB_HOST}:${NOTIFICATION_DB_PORT}/${NOTIFICATION_DB_NAME}?useUnicode=true&characterEncoding=UTF-8&characterSetResults=utf8mb4&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sslMode=${NOTIFICATION_DB_SSL_MODE:REQUIRED}&useAffectedRows=true}
    username: ${NOTIFICATION_DB_USER}
    password: ${NOTIFICATION_DB_PASSWORD}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:${SMTP_USER:}}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  data:
    redis:
      url: ${NOTIFICATION_REDIS_URL:redis://${REDIS_USERNAME:}:${REDIS_PASSWORD:}@${REDIS_HOST:localhost}:${REDIS_PORT:26379}/${REDIS_DB:0}}
      ssl:
        enabled: ${NOTIFICATION_REDIS_SSL_ENABLED:false}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      # Per-owner Redis ACL user (review 2026-08-25). Empty default keeps
      # no-auth local dev working; compose maps it per service.
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
  task:
    scheduling:
      pool:
        size: 4
        thread-name-prefix: notification-scheduled-
      shutdown:
        await-termination: true
        await-termination-period: ${SPRING_TASK_SCHEDULING_SHUTDOWN_AWAIT_TERMINATION_PERIOD:45s}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

app:
  email:
    enabled: ${APP_EMAIL_ENABLED:${EMAIL_ENABLED:false}}
    from-name: ${APP_EMAIL_FROM_NAME:${EMAIL_FROM_NAME:UltiCode}}

ulticode:
  notification:
    worker:
      enabled: ${NOTIFICATION_WORKER_ENABLED:true}
    ledger:
      reaper-interval-ms: ${NOTIFICATION_LEDGER_REAPER_INTERVAL_MS:300000}
      reaper-initial-delay-ms: ${NOTIFICATION_LEDGER_REAPER_INITIAL_DELAY_MS:60000}

notification:
  websocket:
    broadcast:
      channel: ${NOTIFICATION_WS_BROADCAST_CHANNEL:ulticode:ws:broadcast}

jwt:
  resource-server:
    enabled: true
  secret: ${JWT_SECRET:}
  expected-issuer: ${JWT_EXPECTED_ISSUER:ulticode-auth}
  expected-audience: ${JWT_EXPECTED_AUDIENCE:ulticode-api}
  allowed-algorithms: ${JWT_ALLOWED_ALGORITHMS:HS256,RS256}
  clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:30}
  rsa:
    enabled: ${JWT_RSA_ENABLED:false}
  jwks-uri: ${JWT_JWKS_URI:http://localhost:9101/auth/jwks}
  jwks-json: ${JWT_JWKS_JSON:}
  jwks:
    cache-ttl-seconds: ${JWT_JWKS_CACHE_TTL_SECONDS:900}
    retry-backoff-seconds: ${JWT_JWKS_RETRY_BACKOFF_SECONDS:30}
    stale-if-error-seconds: ${JWT_JWKS_STALE_IF_ERROR_SECONDS:300}
    http-timeout-ms: ${JWT_JWKS_HTTP_TIMEOUT_MS:800}
    allowed-hosts: ${JWT_JWKS_ALLOWED_HOSTS:localhost,127.0.0.1,::1,backend-auth}

security:
  internal-delegation:
    # Base64-encoded X509 public key; Notification never receives Admin private material.
    public-key: ${INTERNAL_DELEGATION_PUBLIC_KEY:}
    key-id: ${INTERNAL_DELEGATION_KEY_ID:}
    issuer: ${INTERNAL_DELEGATION_ISSUER:backend-admin}
    audience: ${INTERNAL_DELEGATION_AUDIENCE:backend-notification}

dubbo:
  application:
    name: ${DUBBO_APPLICATION_NAME:backend-notification}
    register-mode: instance
    qos-enable: false
    protocol: tri
    metadata-type: local
  protocol:
    name: tri
    ssl-enabled: ${DUBBO_PROTOCOL_SSL_ENABLED:false}
    port: ${NOTIFICATION_DUBBO_PORT:20885}
    triple:
      max-requests-per-connection: 50
  ssl:
    default: ${DUBBO_SSL_DEFAULT:false}
    server-key-cert-chain-path: ${DUBBO_SSL_SERVER_KEY_CERT_CHAIN_PATH:}
    server-private-key-path: ${DUBBO_SSL_SERVER_PRIVATE_KEY_PATH:}
    server-trust-cert-collection-path: ${DUBBO_SSL_SERVER_TRUST_CERT_COLLECTION_PATH:}
    client-key-cert-chain-path: ${DUBBO_SSL_CLIENT_KEY_CERT_CHAIN_PATH:}
    client-private-key-path: ${DUBBO_SSL_CLIENT_PRIVATE_KEY_PATH:}
    client-trust-cert-collection-path: ${DUBBO_SSL_CLIENT_TRUST_CERT_COLLECTION_PATH:}
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:${NACOS_PORT:28848}?namespace=${DUBBO_NAMESPACE:dev}}
    username: ${DUBBO_REGISTRY_USERNAME:${NOTIFICATION_NACOS_USERNAME:}}
    password: ${DUBBO_REGISTRY_PASSWORD:${NOTIFICATION_NACOS_PASSWORD:}}
    timeout: 5000
    use-as-config-center: true
    use-as-metadata-center: true
    parameters:
      namespace: ${DUBBO_NAMESPACE:dev}
      group: DEFAULT_GROUP
  scan:
    base-packages: com.ulticode.notification
  consumer:
    version: 1.0.0
    check: false
    timeout: 3000
    retries: 0
  provider:
    filter: default
  cloud:
    subscribed-services: ''

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      headers:
        Authorization: ${MANAGEMENT_OTLP_AUTHORIZATION:}
      timeout: 5s
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_ENABLED:false}
        url: ${MANAGEMENT_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${MANAGEMENT_OTLP_METRICS_STEP:30s}

logging:
  level:
    com.ulticode: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]"

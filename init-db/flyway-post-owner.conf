# Flyway configuration for controls that require every owner schema to exist.
# This chain runs after the shared and five owner chains with the privileged
# migration identity; owner-scoped migration accounts must not revoke grants
# in another owner's schema.
flyway.locations=filesystem:migrations/post-owner
flyway.defaultSchema=ulticode
flyway.table=flyway_post_owner_history
flyway.createSchemas=false
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql
flyway.encoding=UTF-8
flyway.outOfOrder=false
flyway.validateOnMigrate=true
flyway.cleanDisabled=true

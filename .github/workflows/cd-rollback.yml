# Manual rollback to a previously approved immutable release manifest. The
# host policy verifies every digest and its evidence before reusing the same
# host mechanics as cd-deploy
# (.github/actions/host-deploy with migrations skipped) and health checks.
name: CD Rollback

on:
  workflow_dispatch:
    inputs:
      image_refs:
        description: >-
          Required nine-line immutable release manifest with
          NAME=registry/path/service@sha256:digest entries.
        required: true
        type: string
      services:
        description: >-
          Services to roll back: 'all', or a comma/space-separated subset of
          backend-auth backend-admin backend-app backend-submission
          backend-notification backend-search backend-judge console management.
        required: true
        type: string
        default: 'all'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  packages: read

jobs:
  verify-images:
    name: Verify immutable image references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate immutable release manifest
        env:
          IMAGE_REF_LIST: ${{ github.event.inputs.image_refs }}
        run: scripts/runbooks/image-reference-policy.sh validate

      - name: Validate deployable service selection
        env:
          SELECTED_SERVICES: ${{ github.event.inputs.services }}
        run: |
          set -euo pipefail
          ALL=("backend-auth" "backend-admin" "backend-app" "backend-submission" "backend-notification" "backend-search" "backend-judge" "console" "management")
          if [[ "$SELECTED_SERVICES" == "all" || -z "$SELECTED_SERVICES" ]]; then
            exit 0
          fi
          for service in $(printf '%s' "$SELECTED_SERVICES" | tr ',' ' ' | xargs); do
            case " ${ALL[*]} " in
              *" $service "*) ;;
              *) echo "::error::Unknown deployable service: $service" >&2; exit 1 ;;
            esac
          done

      # The remote host performs registry-backed verification immediately
      # before pull/up, against the same manifest supplied to this job.

  rollback:
    name: Rollback selected services
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-images
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Roll back on host
        uses: ./.github/actions/host-deploy
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          user: ${{ secrets.DEPLOY_USER }}
          path: ${{ secrets.DEPLOY_PATH }}
          image_refs: ${{ github.event.inputs.image_refs }}
          services: ${{ github.event.inputs.services }}
          supply_chain_identity: ${{ secrets.SUPPLY_CHAIN_CERT_IDENTITY }}
          skip_migrations: 'true'
          registry: ghcr.io
          github_token: ${{ secrets.GITHUB_TOKEN }}
          actor: ${{ github.actor }}

      - name: Health check all services
        uses: ./.github/actions/host-health
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          user: ${{ secrets.DEPLOY_USER }}

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Rollback failed. Check immutable image verification and host logs for details."

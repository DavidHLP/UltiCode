name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      console: ${{ steps.select.outputs.console }}
      management: ${{ steps.select.outputs.management }}
      landing: ${{ steps.select.outputs.landing }}
      contract: ${{ steps.select.outputs.contract }}
      docker: ${{ steps.select.outputs.docker }}
      agent: ${{ steps.select.outputs.agent }}
      release: ${{ steps.select.outputs.release }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select gates from event diff
        id: select
        run: python3 scripts/ci/select-checks.py

  governance:
    name: CI Governance
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pinned policy dependency
        run: python -m pip install --disable-pip-version-check --requirement scripts/ci/requirements.txt
      - name: Install actionlint
        run: |
          tool_dir=$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")
          archive="$tool_dir/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_dir" actionlint
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Validate Actions syntax and embedded shell
        run: actionlint
      - name: Validate CI policy
        run: python3 scripts/ci/check-workflows.py --root .
      - name: Test CI selection and gate aggregation
        run: bash scripts/test/cicd-contract.sh
      - name: Run zero-infrastructure validation contract
        run: bash scripts/test/zero-infra-validation-contract.sh --static-only

  security:
    name: Security Gate
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    uses: ./.github/workflows/_security.yml

  backend:
    name: Backend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/_backend.yml

  frontend:
    name: Frontend
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.console == 'true' || needs.changes.outputs.management == 'true' || needs.changes.outputs.landing == 'true') }}
    uses: ./.github/workflows/_frontend.yml
    with:
      console_changed: ${{ needs.changes.outputs.console == 'true' }}
      management_changed: ${{ needs.changes.outputs.management == 'true' }}
      landing_changed: ${{ needs.changes.outputs.landing == 'true' }}

  contract:
    name: Contract Compatibility
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.contract == 'true' }}
    uses: ./.github/workflows/_contract.yml

  docker:
    name: Docker Verify
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docker == 'true' }}
    uses: ./.github/workflows/_docker.yml

  agent:
    name: Agent Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.agent == 'true' }}
    uses: ./.github/workflows/_agent.yml

  ci-ok:
    name: ci-ok
    needs: [changes, governance, security, backend, frontend, contract, docker, agent]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify every selected gate succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          SELECTED: '{"backend":"${{ needs.changes.outputs.backend }}","console":"${{ needs.changes.outputs.console }}","management":"${{ needs.changes.outputs.management }}","landing":"${{ needs.changes.outputs.landing }}","contract":"${{ needs.changes.outputs.contract }}","docker":"${{ needs.changes.outputs.docker }}","agent":"${{ needs.changes.outputs.agent }}"}'
        run: python3 scripts/ci/check-results.py

  publish:
    needs: [changes, ci-ok]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true' && needs.ci-ok.result == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml

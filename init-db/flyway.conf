# Flyway Configuration for UltiCode Database
# Generated: 2026-05-30

# Database connection is supplied by `scripts/dev/migrate.sh` or CI/CD.
# Do not store credentials in this file.

# Migration Locations
# Shared/root migrations are the SQL files directly under migrations. Owner
# migrations live in subdirectories and are applied through flyway-*.conf.
flyway.locations=filesystem:migrations/*.sql

# Baseline Configuration
# Set baselineOnMigrate=true if running against an existing database without Flyway history
# Set baselineOnMigrate=false for fresh databases (all migrations run from scratch)
flyway.baselineOnMigrate=false

# Migration Naming
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

# Encoding
flyway.encoding=UTF-8

# Safety Options
flyway.outOfOrder=false
flyway.validateOnMigrate=true
flyway.cleanDisabled=true

# MySQL Specific
flyway.connectRetries=3
flyway.connectRetriesInterval=10

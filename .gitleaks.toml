title = "UltiCode Gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Generated build/dependency directories, vendored assets, generated caches"
paths = [
  '''(^|/)(target|dist|node_modules|coverage)/''',
  # Generated knowledge-graph cache (untracked since the CI secret-scan fix).
  '''^services/graphify-out/cache/''',
]
# Known test-only fixtures — values are explicitly non-production.
# NOTE: allowlist regexes match the captured Secret, not the full line.
regexes = [
  # BackendAdminApplicationTest JWT secret (base64 of
  # "TestSecretForBackendApplicationTestOnlyAtLeast64").
  '''^VGVzdFNlY3JldEZvckJhY2tlbmRBZG1pbkFwcGxpY2F0aW9uVGVzdE9ubHlBdExlYXN0NjQ=$''',
  # RsaKeyManagerTest asserts method names; "PrivateKeyB64" trips the key regex.
  '''^(getCurrent|getPrevious)PrivateKeyB64$''',
]

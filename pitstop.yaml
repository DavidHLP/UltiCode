# Generated by pitstop init — 请根据实际情况修改

project:
  name: "UltiCode"

services:
  services:
    type: springboot
    path: "services"
    command: "powershell -NoProfile -ExecutionPolicy Bypass -File ..\\scripts\\pitstop-start-backend.ps1"
    port: 9101
    health_check: "http://localhost:9101/api/v1/auth/health"

  console:
    type: vue
    path: "apps\\console"
    command: "pnpm dev"
    port: 9002
    health_check: "http://localhost:9002"

  management:
    type: vue
    path: "apps\\management"
    command: "pnpm dev"
    port: 9003
    health_check: "http://localhost:9003"

requirements:
  java: ">=17"
  maven: ">=3.8"
  node: ">=20.19"
  pnpm: ">=9"

logging:
  dir: "./logs"
  stdout: true

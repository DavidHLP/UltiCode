server:
  port: ${SERVER_PORT:9102}

spring:
  application:
    name: backend-admin
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:23306}/${DB_NAME:ulticode}?useUnicode=true&characterEncoding=UTF-8&characterSetResults=utf8mb4&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:ulticode}
    password: ${DB_PASSWORD:}
  # P7-RELOCATE: admin scans the App-owned domain services (contest/submission/
  # queue write paths) which enqueue via the shared Redisson queues, so the
  # admin shell needs the same Redis wiring as backend-app.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8

backup:
  dir: ${BACKUP_DIR:/tmp/backups}
  process:
    timeout-seconds: ${BACKUP_PROCESS_TIMEOUT_SECONDS:1800}
    mysqldump-path: ${BACKUP_PROCESS_MYSQLDUMP_PATH:mysqldump}
    mysql-path: ${BACKUP_PROCESS_MYSQL_PATH:mysql}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ulticode.modules.admin.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    db:
      enabled: false
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 5s

dubbo:
  application:
    name: ${DUBBO_APPLICATION_NAME:backend-admin}
    register-mode: instance
    qos-enable: false
    protocol: tri
    metadata-type: local
  protocol:
    name: tri
    # bootstrap (up.sh) 以 DUBBO_PROTOCOL_PORT=-1 随机端口运行, 避免与
    # PM2 ulticode-admin (20882) 或残留的 bootstrap JVM 抢端口。
    port: ${DUBBO_PROTOCOL_PORT:20882}
    triple:
      max-requests-per-connection: 50
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:${NACOS_PORT:28848}?namespace=${DUBBO_NAMESPACE:dev}}
    username: ${DUBBO_REGISTRY_USERNAME:${NACOS_USERNAME:}}
    password: ${DUBBO_REGISTRY_PASSWORD:${NACOS_PASSWORD:}}
    timeout: 5000
    use-as-config-center: true
    use-as-metadata-center: true
    parameters:
      namespace: ${DUBBO_NAMESPACE:dev}
      group: DEFAULT_GROUP
  scan:
    base-packages: com.ulticode.admin.dubbo.provider
  consumer:
    check: false
    # P4-RPC-002: §6.4 global consumer defaults — fail-safe for writes.
    # Default is the WRITE boundary: retries=0 (no auto-retry, prevents
    # double-apply on mutating RPCs) + timeout=3000ms (write upper bound).
    # Query RPCs MUST override per-reference:
    #   @DubboReference(timeout=RpcPolicy.QUERY_TIMEOUT_MS, retries=RpcPolicy.QUERY_RETRIES)
    # Rationale: a write RPC that accidentally inherits retry=1 can
    # double-apply a side effect (critical correctness bug); a query RPC
    # that inherits retry=0 is merely conservative (safe, suboptimal).
    timeout: 3000
    retries: 0
  provider:
    filter: default
  cloud:
    subscribed-services: ''

logging:
  level:
    root: INFO
    com.ulticode: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]"

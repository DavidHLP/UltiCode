name: 'Host deploy (SSH + compose)'
description: >-
  Shared deploy mechanics for cd-deploy/cd-rollback: install the SSH key,
  optionally run the ordered owner migration manifest, provision judge-sandbox prerequisites,
  verify the signed immutable image manifest, then pull and `docker compose up`
  on the host, optionally restricted to a subset of services.
inputs:
  ssh_key:
    description: 'Private SSH key for the deploy host'
    required: true
  known_hosts:
    description: 'Environment-pinned known_hosts entries for the deploy host'
    required: true
  host:
    required: true
  port:
    required: false
    default: '22'
  user:
    required: true
  path:
    description: 'Deploy directory on the host'
    required: true
  image_refs:
    description: >-
      Newline-separated NAME=registry/path/service@sha256:digest entries for
      all nine deployable services. Every entry is verified before Compose.
    required: true
  source_commit:
    description: 'Approved source commit checked out on the deployment host'
    required: true
  schema_manifest_checksum:
    description: 'Approved canonical migration manifest SHA-256'
    required: true
  deployment_descriptor_file:
    description: 'Remote deployment descriptor path relative to the deploy root'
    required: false
    default: '.local/deploy/deployment.json'
  services:
    description: >-
      Optional subset of compose services to pull and up (comma/space
      separated, e.g. "backend-auth backend-app"). Empty or "all" reconciles
      the whole stack.
    required: false
    default: ''
  supply_chain_identity:
    description: >-
      Exact keyless Cosign certificate identity allowed to sign release images.
    required: true
  supply_chain_issuer:
    description: 'OIDC issuer allowed for release image signatures'
    required: false
    default: 'https://token.actions.githubusercontent.com'
  supply_chain_exception_file:
    description: 'Optional remote Trivy ignorefile; it must have a future expiry timestamp'
    required: false
    default: ''
  supply_chain_exception_expires_at:
    description: 'UTC expiry for the optional Trivy ignorefile (YYYY-MM-DDTHH:MM:SSZ)'
    required: false
    default: ''
  skip_migrations:
    description: '"true" skips the Flyway migrate step'
    required: false
    default: 'false'
  registry:
    required: false
    default: ghcr.io
  github_token:
    description: 'Token used to docker login to GHCR on the host'
    required: true
  actor:
    required: true
  migration_db_host:
    description: 'Privileged migration datasource host; required when migrations run'
    required: false
    default: ''
  migration_db_port:
    description: 'Privileged migration datasource port; required when migrations run'
    required: false
    default: ''
  migration_db_name:
    description: 'Shared migration database name; required when migrations run'
    required: false
    default: ''
  migration_db_user:
    description: 'Privileged migration account; never use an owner runtime account'
    required: false
    default: ''
  migration_db_password:
    description: 'Privileged migration account password'
    required: false
    default: ''
  submission_migration_db_user:
    description: 'Separate privileged Submission migration account'
    required: false
    default: ''
  submission_migration_db_password:
    description: 'Separate privileged Submission migration account password'
    required: false
    default: ''
  auth_db_user:
    description: 'Auth runtime account name used by migration preflight'
    required: false
    default: ''
  admin_db_user:
    description: 'Admin runtime account name used by migration preflight'
    required: false
    default: ''
  app_db_user:
    description: 'App runtime account name used by migration preflight'
    required: false
    default: ''
  notification_db_user:
    description: 'Notification runtime account name used by migration preflight'
    required: false
    default: ''
  submission_db_user:
    description: 'Submission runtime account name used by migration preflight'
    required: false
    default: ''
  migration_report_dir:
    description: 'Remote directory for machine and human migration reports'
    required: false
    default: '.local/migration-audit'
  migration_lock_file:
    description: 'Remote lock file used to serialize owner migration runs'
    required: false
    default: '.local/migration-audit/owner-migrations.lock'
  migration_mysql_bin:
    description: 'Remote mysql client used for the cross-replica fenced migration lease'
    required: false
    default: 'mysql'
  migration_mysql_container:
    description: 'Optional MySQL container used instead of a host mysql client'
    required: false
    default: ''
  migration_mysql_container_port:
    description: 'MySQL port inside migration_mysql_container'
    required: false
    default: '3306'
runs:
  using: 'composite'
  steps:
    - name: Install SSH key
      shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.ssh_key }}
        DEPLOY_KNOWN_HOSTS: ${{ inputs.known_hosts }}
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail
        [[ -n "$DEPLOY_KEY" ]] || { echo "::error::deploy SSH key is empty" >&2; exit 1; }
        [[ -n "$DEPLOY_KNOWN_HOSTS" ]] || { echo "::error::deploy known_hosts is empty" >&2; exit 1; }
        install -d -m 700 ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
        host_lookup="$DEPLOY_HOST"
        [[ "$DEPLOY_PORT" == "22" ]] || host_lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"
        ssh-keygen -F "$host_lookup" -f ~/.ssh/known_hosts >/dev/null \
          || { echo "::error::known_hosts has no pinned key for $host_lookup" >&2; exit 1; }

    - name: Validate release and deployment integrity before mutation
      shell: bash
      env:
        IMAGE_REF_LIST: ${{ inputs.image_refs }}
        DEPLOYMENT_COMMIT: ${{ inputs.source_commit }}
        EXPECTED_SCHEMA_MANIFEST_CHECKSUM: ${{ inputs.schema_manifest_checksum }}
        DEPLOYMENT_DESCRIPTOR_FILE: ${{ inputs.deployment_descriptor_file }}
        COSIGN_CERT_IDENTITY: ${{ inputs.supply_chain_identity }}
        COSIGN_CERT_ISSUER: ${{ inputs.supply_chain_issuer }}
        SUPPLY_CHAIN_EXCEPTION_FILE: ${{ inputs.supply_chain_exception_file }}
        SUPPLY_CHAIN_EXCEPTION_EXPIRES_AT: ${{ inputs.supply_chain_exception_expires_at }}
        GITHUB_TOKEN_VALUE: ${{ inputs.github_token }}
        DEPLOY_ACTOR: ${{ inputs.actor }}
        DEPLOY_REGISTRY: ${{ inputs.registry }}
        SKIP_MIGRATIONS: ${{ inputs.skip_migrations }}
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_PORT: ${{ inputs.port }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        shell_quote() { printf '%q' "$1"; }
        [[ -n "$IMAGE_REF_LIST" ]] || { echo "::error::image_refs is required" >&2; exit 1; }
        [[ -n "$DEPLOYMENT_COMMIT" ]] || { echo "::error::source_commit is required" >&2; exit 1; }
        [[ -n "$EXPECTED_SCHEMA_MANIFEST_CHECKSUM" ]] || { echo "::error::schema_manifest_checksum is required" >&2; exit 1; }
        [[ -n "$COSIGN_CERT_IDENTITY" ]] || { echo "::error::supply_chain_identity is required" >&2; exit 1; }
        IMAGE_REF_LIST="$IMAGE_REF_LIST" \
          "$GITHUB_WORKSPACE/scripts/runbooks/image-reference-policy.sh" validate

        SSH_CMD=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          "$DEPLOY_USER@$DEPLOY_HOST" -p "$DEPLOY_PORT")
        EXPORTS=""
        while IFS= read -r pair; do
          [[ -z "$pair" ]] && continue
          NAME="${pair%%=*}"
          VALUE="${pair#*=}"
          EXPORTS+=" $(shell_quote "$NAME")=$(shell_quote "$VALUE")"
        done <<< "$IMAGE_REF_LIST"
        REMOTE_ENV="$EXPORTS"
        REMOTE_ENV+=" DEPLOYMENT_COMMIT=$(shell_quote "$DEPLOYMENT_COMMIT")"
        REMOTE_ENV+=" EXPECTED_SCHEMA_MANIFEST_CHECKSUM=$(shell_quote "$EXPECTED_SCHEMA_MANIFEST_CHECKSUM")"
        REMOTE_ENV+=" DEPLOYMENT_DESCRIPTOR_FILE=$(shell_quote "$DEPLOYMENT_DESCRIPTOR_FILE")"
        REMOTE_ENV+=" COSIGN_CERT_IDENTITY=$(shell_quote "$COSIGN_CERT_IDENTITY")"
        REMOTE_ENV+=" COSIGN_CERT_ISSUER=$(shell_quote "$COSIGN_CERT_ISSUER")"
        REMOTE_ENV+=" SUPPLY_CHAIN_EXCEPTION_FILE=$(shell_quote "$SUPPLY_CHAIN_EXCEPTION_FILE")"
        REMOTE_ENV+=" SUPPLY_CHAIN_EXCEPTION_EXPIRES_AT=$(shell_quote "$SUPPLY_CHAIN_EXCEPTION_EXPIRES_AT")"

        printf '%s\n' "$GITHUB_TOKEN_VALUE" | "${SSH_CMD[@]}" \
          "docker login $(shell_quote "$DEPLOY_REGISTRY") -u $(shell_quote "$DEPLOY_ACTOR") --password-stdin"

        remote_command="cd $(shell_quote "$DEPLOY_PATH") &&"
        remote_command+=" $REMOTE_ENV ./scripts/runbooks/deployment-integrity.sh preflight &&"
        if [[ "$SKIP_MIGRATIONS" == "true" ]]; then
          remote_command+=" $REMOTE_ENV ./scripts/runbooks/deployment-integrity.sh check-rollback &&"
        fi
        remote_command+=" $REMOTE_ENV docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet &&"
        remote_command+=" $REMOTE_ENV ./scripts/runbooks/image-reference-policy.sh verify"
        "${SSH_CMD[@]}" "$remote_command"

    - name: Run ordered owner database migrations
      if: ${{ inputs.skip_migrations != 'true' }}
      shell: bash
      env:
        MIGRATION_DB_HOST: ${{ inputs.migration_db_host }}
        MIGRATION_DB_PORT: ${{ inputs.migration_db_port }}
        MIGRATION_DB_NAME: ${{ inputs.migration_db_name }}
        MIGRATION_DB_USER: ${{ inputs.migration_db_user }}
        MIGRATION_DB_PASSWORD: ${{ inputs.migration_db_password }}
        SUBMISSION_MIGRATION_DB_USER: ${{ inputs.submission_migration_db_user }}
        SUBMISSION_MIGRATION_DB_PASSWORD: ${{ inputs.submission_migration_db_password }}
        AUTH_DB_USER: ${{ inputs.auth_db_user }}
        ADMIN_DB_USER: ${{ inputs.admin_db_user }}
        APP_DB_USER: ${{ inputs.app_db_user }}
        NOTIFICATION_DB_USER: ${{ inputs.notification_db_user }}
        SUBMISSION_DB_USER: ${{ inputs.submission_db_user }}
        MIGRATION_REPORT_DIR: ${{ inputs.migration_report_dir }}
        MIGRATION_LOCK_FILE: ${{ inputs.migration_lock_file }}
        MIGRATION_MYSQL_BIN: ${{ inputs.migration_mysql_bin }}
        MIGRATION_MYSQL_CONTAINER: ${{ inputs.migration_mysql_container }}
        MIGRATION_MYSQL_CONTAINER_PORT: ${{ inputs.migration_mysql_container_port }}
      run: |
        set -euo pipefail
        for required in MIGRATION_DB_HOST MIGRATION_DB_PORT MIGRATION_DB_NAME \
          MIGRATION_DB_USER MIGRATION_DB_PASSWORD SUBMISSION_MIGRATION_DB_USER \
          SUBMISSION_MIGRATION_DB_PASSWORD AUTH_DB_USER ADMIN_DB_USER APP_DB_USER \
          NOTIFICATION_DB_USER SUBMISSION_DB_USER; do
          [[ -n "${!required}" ]] || { echo "::error::$required is required for owner migrations" >&2; exit 1; }
        done

        shell_quote() { printf '%q' "$1"; }
        SSH_CMD=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          "${{ inputs.user }}@${{ inputs.host }}" -p "${{ inputs.port }}")
        remote_command="cd $(shell_quote "${{ inputs.path }}") &&"
        remote_command+=" MIGRATION_DB_HOST=$(shell_quote "$MIGRATION_DB_HOST")"
        remote_command+=" MIGRATION_DB_PORT=$(shell_quote "$MIGRATION_DB_PORT")"
        remote_command+=" MIGRATION_DB_NAME=$(shell_quote "$MIGRATION_DB_NAME")"
        remote_command+=" MIGRATION_DB_USER=$(shell_quote "$MIGRATION_DB_USER")"
        remote_command+=" MIGRATION_DB_PASSWORD=$(shell_quote "$MIGRATION_DB_PASSWORD")"
        remote_command+=" SUBMISSION_MIGRATION_DB_USER=$(shell_quote "$SUBMISSION_MIGRATION_DB_USER")"
        remote_command+=" SUBMISSION_MIGRATION_DB_PASSWORD=$(shell_quote "$SUBMISSION_MIGRATION_DB_PASSWORD")"
        remote_command+=" AUTH_DB_NAME=auth AUTH_DB_USER=$(shell_quote "$AUTH_DB_USER")"
        remote_command+=" ADMIN_DB_NAME=admin ADMIN_DB_USER=$(shell_quote "$ADMIN_DB_USER")"
        remote_command+=" APP_DB_NAME=app APP_DB_USER=$(shell_quote "$APP_DB_USER")"
        remote_command+=" NOTIFICATION_DB_NAME=notification NOTIFICATION_DB_USER=$(shell_quote "$NOTIFICATION_DB_USER")"
        remote_command+=" SUBMISSION_DB_NAME=submission SUBMISSION_DB_USER=$(shell_quote "$SUBMISSION_DB_USER")"
        remote_command+=" OWNER_MIGRATION_REPORT_DIR=$(shell_quote "$MIGRATION_REPORT_DIR")"
        remote_command+=" OWNER_MIGRATION_LOCK_FILE=$(shell_quote "$MIGRATION_LOCK_FILE")"
        remote_command+=" OWNER_MIGRATION_MYSQL_BIN=$(shell_quote "$MIGRATION_MYSQL_BIN")"
        remote_command+=" OWNER_MIGRATION_MYSQL_CONTAINER=$(shell_quote "$MIGRATION_MYSQL_CONTAINER")"
        remote_command+=" OWNER_MIGRATION_MYSQL_CONTAINER_PORT=$(shell_quote "$MIGRATION_MYSQL_CONTAINER_PORT")"
        remote_command+=" ./scripts/runbooks/owner-migration-manifest.sh migrate"
        "${SSH_CMD[@]}" "$remote_command"

    - name: Materialize runtime Redis ACL
      shell: bash
      run: |
        set -euo pipefail
        shell_quote() { printf '%q' "$1"; }
        SSH_CMD=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          "${{ inputs.user }}@${{ inputs.host }}" -p "${{ inputs.port }}")
        remote_command="cd $(shell_quote "${{ inputs.path }}") &&"
        remote_command+=" ./scripts/runbooks/redis-acl-rotation.sh materialize"
        "${SSH_CMD[@]}" "$remote_command"

    - name: Provision sandbox prerequisites on host
      # The judge worker healthcheck requires the sandbox image and seccomp
      # profile to exist on the host; without this step a fresh host would
      # fail the whole deploy (and unrelated rollbacks) with no hint.
      # Idempotent, so rollback can safely reuse it.
      shell: bash
      run: |
        SSH_CMD="ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts ${{ inputs.user }}@${{ inputs.host }} -p ${{ inputs.port }}"
        $SSH_CMD "cd ${{ inputs.path }} && \
                  export SANDBOX_HOST_DIR=\"\${SANDBOX_HOST_DIR:-/opt/ulticode/sandbox}\" && \
                  sudo -n install -d -o 1000 -g 1000 \"\$SANDBOX_HOST_DIR/workspace\" && \
                  sudo -n install -o 1000 -g 1000 docker/sandbox/seccomp-profile.json \"\$SANDBOX_HOST_DIR/seccomp-profile.json\" && \
                  docker/sandbox/harness/build.sh && \
                  echo 'sandbox prerequisites ready'"

    - name: Pull and deploy services
      shell: bash
      env:
        IMAGE_REF_LIST: ${{ inputs.image_refs }}
        DEPLOYMENT_COMMIT: ${{ inputs.source_commit }}
        EXPECTED_SCHEMA_MANIFEST_CHECKSUM: ${{ inputs.schema_manifest_checksum }}
        DEPLOYMENT_DESCRIPTOR_FILE: ${{ inputs.deployment_descriptor_file }}
        COSIGN_CERT_IDENTITY: ${{ inputs.supply_chain_identity }}
        COSIGN_CERT_ISSUER: ${{ inputs.supply_chain_issuer }}
        SUPPLY_CHAIN_EXCEPTION_FILE: ${{ inputs.supply_chain_exception_file }}
        SUPPLY_CHAIN_EXCEPTION_EXPIRES_AT: ${{ inputs.supply_chain_exception_expires_at }}
        DEPLOY_SERVICES: ${{ inputs.services }}
      run: |
        set -euo pipefail
        shell_quote() { printf '%q' "$1"; }
        [[ -n "$IMAGE_REF_LIST" ]] || { echo "::error::image_refs is required" >&2; exit 1; }
        [[ -n "$DEPLOYMENT_COMMIT" ]] || { echo "::error::source_commit is required" >&2; exit 1; }
        [[ -n "$EXPECTED_SCHEMA_MANIFEST_CHECKSUM" ]] || { echo "::error::schema_manifest_checksum is required" >&2; exit 1; }
        [[ -n "$COSIGN_CERT_IDENTITY" ]] || { echo "::error::supply_chain_identity is required" >&2; exit 1; }

        SSH_CMD=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          "${{ inputs.user }}@${{ inputs.host }}" -p "${{ inputs.port }}")

        # Turn the validated manifest into shell assignments. The same
        # assignments feed the remote verifier and Compose, so no tag fallback
        # or independently parsed service override can bypass the policy.
        EXPORTS=""
        while IFS= read -r pair; do
          [[ -z "$pair" ]] && continue
          NAME="${pair%%=*}"
          VALUE="${pair#*=}"
          EXPORTS+=" $(shell_quote "$NAME")=$(shell_quote "$VALUE")"
        done <<< "$IMAGE_REF_LIST"
        REMOTE_ENV="$EXPORTS"
        REMOTE_ENV+=" DEPLOYMENT_COMMIT=$(shell_quote "$DEPLOYMENT_COMMIT")"
        REMOTE_ENV+=" EXPECTED_SCHEMA_MANIFEST_CHECKSUM=$(shell_quote "$EXPECTED_SCHEMA_MANIFEST_CHECKSUM")"
        REMOTE_ENV+=" DEPLOYMENT_DESCRIPTOR_FILE=$(shell_quote "$DEPLOYMENT_DESCRIPTOR_FILE")"
        REMOTE_ENV+=" COSIGN_CERT_IDENTITY=$(shell_quote "$COSIGN_CERT_IDENTITY")"
        REMOTE_ENV+=" COSIGN_CERT_ISSUER=$(shell_quote "$COSIGN_CERT_ISSUER")"
        REMOTE_ENV+=" SUPPLY_CHAIN_EXCEPTION_FILE=$(shell_quote "$SUPPLY_CHAIN_EXCEPTION_FILE")"
        REMOTE_ENV+=" SUPPLY_CHAIN_EXCEPTION_EXPIRES_AT=$(shell_quote "$SUPPLY_CHAIN_EXCEPTION_EXPIRES_AT")"

        # The manifest was verified before mutation; pull/up now records a
        # pending descriptor atomically, and host-health marks it final.
        remote_command="cd $(shell_quote "${{ inputs.path }}") &&"

        # Optional selective rollout/rollback: restrict pull/up to an explicit
        # allowlisted subset instead of reconciling the whole stack.
        TARGETS=""
        if [ -n "$DEPLOY_SERVICES" ] && [ "$DEPLOY_SERVICES" != "all" ]; then
          for svc in $(printf '%s' "$DEPLOY_SERVICES" | tr ',' ' ' | xargs); do
            case "$svc" in
              backend-auth|backend-admin|backend-app|backend-submission|backend-notification|backend-search|backend-judge|console|management) ;;
              *) echo "::error::Invalid deployable service: ${svc}" >&2; exit 1 ;;
            esac
            TARGETS="$TARGETS $svc"
          done
        fi

        remote_command+=" $REMOTE_ENV docker compose -f docker-compose.yml -f docker-compose.prod.yml pull$TARGETS &&"
        remote_command+=" $REMOTE_ENV docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans$TARGETS &&"
        remote_command+=" $REMOTE_ENV DEPLOYED_SERVICES=$(shell_quote "${DEPLOY_SERVICES:-all}") DEPLOYMENT_STATUS=PENDING_HEALTH ./scripts/runbooks/deployment-integrity.sh record"
        "${SSH_CMD[@]}" "$remote_command"

server:
  port: ${SUBMISSION_SERVER_PORT:9106}

spring:
  application:
    name: backend-submission
  datasource:
    url: jdbc:mysql://${SUBMISSION_DB_HOST:${DB_HOST:localhost}}:${SUBMISSION_DB_PORT:${DB_PORT:23306}}/${SUBMISSION_DB_NAME:submission}?useUnicode=true&characterEncoding=UTF-8&characterSetResults=utf8mb4&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&useAffectedRows=true
    username: ${SUBMISSION_DB_USER:${DB_USER:ulticode}}
    password: ${SUBMISSION_DB_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${SUBMISSION_DB_POOL_SIZE:8}
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: input

app:
  submission:
    owner:
      # compat keeps the App as the single writer while the App route is local.
      # Set local only with the authorized schema cutover and grant transition.
      mode: ${APP_SUBMISSION_OWNER_MODE:compat}
  features:
    use-generation-fence: ${APP_FEATURES_USE_GENERATION_FENCE:true}
    use-judge-outbox: ${APP_FEATURES_USE_JUDGE_OUTBOX:true}
    judge-queue:
      use-port: ${APP_FEATURES_JUDGE_QUEUE_USE_PORT:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

dubbo:
  application:
    name: ${DUBBO_APPLICATION_NAME:backend-submission}
    register-mode: instance
    qos-enable: false
    protocol: tri
    metadata-type: local
  protocol:
    name: tri
    port: ${SUBMISSION_DUBBO_PORT:20886}
    triple:
      max-requests-per-connection: 50
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:${NACOS_PORT:28848}?namespace=${DUBBO_NAMESPACE:dev}}
    username: ${DUBBO_REGISTRY_USERNAME:${NACOS_USERNAME:}}
    password: ${DUBBO_REGISTRY_PASSWORD:${NACOS_PASSWORD:}}
    timeout: 5000
    use-as-config-center: true
    use-as-metadata-center: true
    parameters:
      namespace: ${DUBBO_NAMESPACE:dev}
      group: DEFAULT_GROUP
  scan:
    base-packages: com.ulticode.submission
  consumer:
    check: false
    timeout: 5000
    retries: 0
  cloud:
    subscribed-services: ''

logging:
  level:
    root: INFO
    com.ulticode.submission: INFO

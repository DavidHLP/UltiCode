server:
  port: ${SERVER_PORT:9001}

spring:
  application:
    name: ulticode-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:23306}/${DB_NAME:ulticode}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:ulticode}
    password: ${DB_PASSWORD:ulticode}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DB:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-characters-long}
  access-token:
    expiration: 900000  # 15 minutes in milliseconds
  refresh-token:
    expiration: 604800000  # 7 days in milliseconds
  cookie:
    access-token:
      name: access_token
      http-only: true
      secure: ${JWT_COOKIE_SECURE:true}
      same-site: strict
      path: /
      max-age: 900  # 15 minutes in seconds
    refresh-token:
      name: refresh_token
      http-only: true
      secure: ${JWT_COOKIE_SECURE:true}
      same-site: strict
      path: /
      max-age: 604800  # 7 days in seconds

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ulticode.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: input                    # 改为 input（UUID）
      logic-delete-field: isDeleted     # 与实体字段一致
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc Configuration
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Logging Configuration
logging:
  level:
    root: INFO
    com.ulticode: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# MeiliSearch Configuration (optional - for full-text search)
meilisearch:
  enabled: ${MEILISEARCH_ENABLED:false}
  host: ${MEILISEARCH_HOST:}
  api-key: ${MEILISEARCH_API_KEY:}

# Recommendation Service Configuration (optional - for personalized recommendations)
recommendation:
  enabled: ${RECOMMENDATION_ENABLED:false}
  service-url: ${RECOMMENDATION_SERVICE_URL:}
  timeout: ${RECOMMENDATION_TIMEOUT:5000}
  nacos-enabled: ${RECOMMENDATION_NACOS_ENABLED:false}
  fallback-url: ${RECOMMENDATION_FALLBACK_URL:}

# Backup Configuration
backup:
  dir: ${BACKUP_DIR:/tmp/backups}

# Email Configuration
spring.mail:
  host: ${SMTP_HOST:localhost}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USER:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

# App-specific email configuration
app:
  email:
    enabled: ${EMAIL_ENABLED:false}
    from-name: ${EMAIL_FROM_NAME:UltiCode}

# Management/Actuator Configuration
management:
  health:
    mail:
      enabled: false

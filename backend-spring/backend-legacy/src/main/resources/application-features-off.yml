# ADR-005 §4 #4: 全部 app.features.* 显式关闭 (与 FeatureFlagsProperties 默认值一致).
# 注意: application.yml 中这些 flag 已通过 ${USE_JUDGE_OUTBOX:false} 等 env var
# 占位符提供默认值, 本 profile 强制把这些值固定为 false/默认值, 用于 CI 矩阵
# "全部关闭" 场景.
#
# 配合 -Dspring.profiles.active=ci,features-off 使用.
# 切换方式 (生产): 见 docs/RUNBOOK.md §10.
spring:
  config:
    activate:
      on-profile: features-off
app:
  features:
    # 5 个产品功能 flag — 全部关闭
    use-new-contest-system: false
    realtime-ranking-enabled: false
    first-solve-notifications-enabled: false
    anticheat-enabled: false
    contest-analytics-enabled: false
    # 5 个 cutover flag — 全部关闭 (与 FeatureFlagsProperties 默认一致)
    use-judge-outbox: false
    use-generation-fence: false
    judge-queue:
      use-port: false
      envelope-version: 1
      cutover-at: "1970-01-01T00:00:00"
    judge-source:
      use-test-cases: false

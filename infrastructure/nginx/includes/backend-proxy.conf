# =============================================================================
# infrastructure/nginx/includes/backend-proxy.conf
#
# Canonical proxy snippet for the owner services, included by both
# `console/nginx.conf` and `management/nginx.conf` from every business
# route family location. Centralising here is what guarantees the full
# header-strip set is uniform across the ingress — replicating this block
# per location is what previously caused drift.
#
# Wildcard limitation: nginx:alpine has no wildcard match for header
# names (`proxy_set_header X-User-* ""` is a syntax error) and the
# `headers-more` module is NOT in the stock image. We enumerate every
# name explicitly below. Underscore variants like `X_User_Id` are
# already rejected at the server scope via `underscores_in_headers off;`
# in the host nginx.conf. Adding a new identity claim? Add it here in
# lock-step with `scripts/test/gateway-baseline.sh` so the assertion
# stays in sync.
#
# Companion files:
#   - infrastructure/nginx/includes/security-headers.conf
#
# This snippet is `include`d from inside a `location` block whose path
# starts with `/api/` or `/ws/`. It does NOT issue `proxy_pass` itself —
# the owning location sets that, so a future per-family upstream swap
# (P1-INFRA-005, gateway cutover) only touches the location block.
#
# What it always does, in order:
#   1. Force HTTP/1.1 (required for upstream upgrade / keep-alive).
#   2. Forward the client-side `Upgrade` header verbatim.
#   3. Set `Connection` to `$connection_upgrade` (defined at host http
#      scope in each nginx.conf). This is "upgrade" when the client asked
#      for an upgrade and "close" otherwise — required for SockJS
#      HTTP-fallback transports, which break under a hardcoded
#      `Connection: upgrade`.
#   4. Carry the standard `Host`, `X-Real-IP`, `X-Forwarded-For`,
#      `X-Forwarded-Proto` chain that every downstream filter trusts.
#   5. Force every plausible client-forged identity header to an empty
#      value so the backend (cookie/JWT-authenticated) is the only source
#      of truth. Adding a new identity claim? Add it HERE in lock-step
#      with the assertion list in scripts/test/gateway-baseline.sh.
# =============================================================================

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# --- Client-forged identity header strip ---
# The blanked set is the cross-product of every plausible identity claim
# that any past or projected upstream filter has been observed to inherit.
# The test in scripts/test/gateway-baseline.sh asserts every name here is
# present — keep this list and that test in lock-step.
#
# X-User-* family
proxy_set_header X-User-Id             "";
proxy_set_header X-User-Name           "";
proxy_set_header X-User-Email          "";
proxy_set_header X-User-Roles          "";
proxy_set_header X-User-Status         "";
proxy_set_header X-User-Idp            "";

# X-Role* family
proxy_set_header X-Role                "";
proxy_set_header X-Roles               "";
proxy_set_header X-Role-Scope          "";

# X-Service* family
proxy_set_header X-Service             "";
proxy_set_header X-Service-Name        "";
proxy_set_header X-Service-Token       "";
proxy_set_header X-Service-Id          "";
proxy_set_header X-Service-Version     "";

# Specific service-forged tokens / auth bypass names
proxy_set_header X-Internal            "";
proxy_set_header X-Admin-Token         "";
proxy_set_header X-Auth-Bypass         "";
proxy_set_header X-Auth-Token          "";
proxy_set_header X-Actor               "";
proxy_set_header X-Actor-Id            "";
proxy_set_header X-Impersonate         "";
proxy_set_header X-Principal           "";
proxy_set_header X-Principal-Id        "";

# Set by trusted upstream proxies when relaying auth decisions
proxy_set_header X-Forwarded-User      "";
proxy_set_header X-Remote-User         "";

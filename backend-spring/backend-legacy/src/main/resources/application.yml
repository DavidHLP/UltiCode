server:
  port: ${SERVER_PORT:9001}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9002,http://localhost:9003}

spring:
  application:
    name: ulticode-backend
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration
      # NOTE: WSL2 + JDK 17.0.2 cgroup-v2 metric NPE excludes live in application-dev.yml
      # (dev-only). Keeping base application.yml free of metric exclusions lets prod keep
      # full system/jvm/tomcat micrometer binders. See JDK-8286157.

  # Redisson Configuration (distributed locks, queues)
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:26379}"
          password: ${REDIS_PASSWORD:}
          database: ${REDIS_DB:0}
          connectionPoolSize: 64
          connectionMinimumIdleSize: 10

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:23306}/${DB_NAME:ulticode}?useUnicode=true&characterEncoding=UTF-8&characterSetResults=utf8mb4&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:ulticode}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # Flyway Configuration - migrations managed in init-db/migrations/
  flyway:
    enabled: true
    locations: filesystem:${FLYWAY_MIGRATIONS_DIR:../init-db/migrations}
    baseline-on-migrate: true
    baseline-version: 20260322
    baseline-description: Initial baseline
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  access-token:
    expiration: 900000 # 15 minutes in milliseconds
  refresh-token:
    expiration: 604800000 # 7 days in milliseconds
  cookie:
    access-token:
      name: access_token
      http-only: true
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: lax
      path: /
      max-age: 900 # 15 minutes in seconds
    refresh-token:
      name: refresh_token
      http-only: true
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: lax
      path: /
      max-age: 604800 # 7 days in seconds

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ulticode.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: input # 改为 input（UUID）

# SpringDoc Configuration
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    # /v3/api-docs is the standard Spring Boot / springdoc path; previously
    # we exposed /api-docs, which made tools and external callers that
    # follow the convention (e.g. Swagger UI, Postman import) return empty.
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Logging Configuration
logging:
  level:
    root: INFO
    com.ulticode: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# MeiliSearch Configuration (optional - for full-text search)
meilisearch:
  enabled: ${MEILISEARCH_ENABLED:false}
  host: ${MEILISEARCH_HOST:}
  api-key: ${MEILISEARCH_API_KEY:}

# C++ sandbox language profile (opt-in via @ConditionalOnProperty on
# CppLanguageProfile). Enabled now that the C++ harness ships in
# docker/sandbox/harness/cpp/. Set SANDBOX_PROFILE_CPP_ENABLED=false to
# disable (e.g. if the sandbox image is not yet (re)built with the harness).
sandbox:
  profile:
    cpp:
      enabled: ${SANDBOX_PROFILE_CPP_ENABLED:true}

# Code Execution Sandbox Configuration
code-execution:
  sandbox:
    enabled: ${SANDBOX_ENABLED:true}
    image: ${SANDBOX_IMAGE:ulticode-sandbox:latest}
    memory: ${SANDBOX_MEMORY:256m}
    cpus: ${SANDBOX_CPUS:1.0}
    timeout: ${SANDBOX_TIMEOUT:10}
    pids-limit: ${SANDBOX_PIDS_LIMIT:128}
    seccomp-profile-path: ${SANDBOX_SECCOMP_PROFILE:C:/Project/UltiCode/docker/sandbox/seccomp-profile.json}
    # D-form (LeetCode/HackerRank harness) refactor — see
    # docker/sandbox/harness/README.md and .claude/PRPs/plans/oj-sandbox-d-form-refactor.plan.md
    # Phase 5.5: D-form is the sole dispatch path. The flag below is
    # read by CodeExecutionService.execute() to validate the language
    # set against the actual executable harnesses (java + python only).
    # It does NOT toggle the dispatcher — D-form is always on.
    #
    # ROLLBACK: the legacy Form A (per-request bash wrapper) path is
    # gone as of commit 8c13ec61f. The only way to roll back D-form
    # is to revert the relevant commits and rebuild the sandbox image:
    #   git revert 8c13ec61f 095a01fd5
    #   cd docker/sandbox && ./harness/build.sh && docker build -t ulticode-sandbox:latest .
    # The env var SANDBOX_DFORM_ENABLED=false no longer does anything
    # useful — it was removed alongside the Form A code.
    d-form:
      enabled: ${SANDBOX_DFORM_ENABLED:true}
      # Path inside the runtime image where the pre-compiled harness lives.
      harness-root: ${SANDBOX_DFORM_HARNESS_ROOT:/opt/harness}
    languages:
      java:
        timeout-seconds: 10
        memory: 256m
      python:
        timeout-seconds: 5
        memory: 128m
      c:
        timeout-seconds: 5
        memory: 128m
      cpp:
        timeout-seconds: 5
        memory: 128m
      go:
        timeout-seconds: 8
        memory: 256m
      rust:
        timeout-seconds: 8
        memory: 256m
      javascript:
        timeout-seconds: 3
        memory: 64m

# Backup Configuration
backup:
  dir: ${BACKUP_DIR:/tmp/backups}

# Email Configuration
spring.mail:
  host: ${SMTP_HOST:localhost}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USER:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

# App-specific configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:9002}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from-name: ${EMAIL_FROM_NAME:UltiCode}
  monitoring:
    # Threshold (ms) above which a SQL execution counts as slow.
    # Surfaced via /monitoring/database.slowQueries.
    slow-query-ms: 500
  features:
    # ADR-003 M3a: write a shadow judge_outbox row on submit/rejudge/reaper.
    # The outbox dispatcher stays in shadow mode (never enqueues); the legacy
    # RQueue remains the sole active producer until M3c cutover.
    use-judge-outbox: ${USE_JUDGE_OUTBOX:false}
    # ADR-003 M3b: claim submissions via CAS acquireLease, heartbeat the lease
    # while judging, and write verdicts through writeVerdictFenced so stale
    # results from a superseded generation are discarded. A reaper recovers
    # crashed JUDGING rows. flag-off behavior is byte-for-byte identical to the
    # legacy selectById+updateById path.
    use-generation-fence: ${USE_GENERATION_FENCE:false}
    # ADR-003 M3c-1: route judge dispatches through the JudgeQueue port
    # (Redisson Streams adapter) instead of the legacy RQueue. M3c-1 ships
    # the port interface; flipping this to true activates the M3c-2
    # dispatcher cutover + M3c-3 worker poll. Default false — no behavior
    # change until M3c-2/3 are also shipped and the canary gate clears.
    judge-queue:
      use-port: ${JUDGE_QUEUE_USE_PORT:false}
      # Envelope version the port writes (1 = legacy fields only, 2 = adds
      # generation/attemptId for fence). The port dual-reads both versions
      # on decode; flipping this to 2 is the M3c-3 cutover for fence-aware
      # dispatches.
      envelope-version: ${JUDGE_QUEUE_ENVELOPE_VERSION:1}
      # F13 cutover watermark: only outbox rows with created_at >=
      # cutover-at AND is_shadow=0 are real-dispatched. Default epoch
      # (1970-01-01) means "no row qualifies" — i.e. real dispatch is
      # inert until an operator sets this on the canary host. The M3c
      # cutover runbook specifies the exact ISO-8601 timestamp to set.
      cutover-at: ${JUDGE_QUEUE_CUTOVER_AT:1970-01-01T00:00:00}
    # P0-1: Judge source configuration
    judge-source:
      use-test-cases: ${JUDGE_SOURCE_USE_TEST_CASES:true}

# Audit configuration
audit:
  export:
    limit: ${AUDIT_EXPORT_LIMIT:10000}

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        # Health+info+prometheus are publicly accessible (see SecurityConfig).
        # Sensitive endpoints (env, beans, mappings, heapdump) stay disabled.
        include: health,info,prometheus
  endpoint:
    health:
      # Hide DB/Redis/queue hostnames from anonymous probes.
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    # NOTE: per-binder `enable: false` overrides for the WSL2 + JDK 17.0.2 cgroup NPE
    # live in application-dev.yml (dev-only). Base file leaves all binders enabled so
    # prod preserves full system/jvm/tomcat metrics.

# OAuth Configuration
oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:9001/auth/github/callback}
    authorize-url: https://github.com/login/oauth/authorize
    token-url: https://github.com/login/oauth/access_token
    user-url: https://api.github.com/user
    scopes: user:email

  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:9001/auth/google/callback}
    authorize-url: https://accounts.google.com/o/oauth2/v2/auth
    token-url: https://oauth2.googleapis.com/token
    user-url: https://www.googleapis.com/oauth2/v2/userinfo
    scopes: email,profile


# Dubbo 3.3.6 + Nacos registry baseline (P1-INFRA-003).
# Phase 1 introduces the runtime, NOT a service. No @DubboService or
# @DubboReference is added yet; the JVM still registers itself as an
# empty Provider so smoke can confirm the registry contract works.
# NOTE: dubbo.config-center and dubbo.metadata-report are deliberately
# NOT configured here. DefaultApplicationDeployer.startConfigCenter in
# Dubbo 3.3.6 calls useRegistryAsConfigCenterIfNecessary(); setting
# `use-as-config-center: false` on the registry short-circuits that
# path. Setting `config-center: { address: "" }` would create an empty
# ConfigCenterConfig and break the `isEmpty(configCenters)` predicate.
dubbo:
  application:
    name: ${DUBBO_APPLICATION_NAME:ulticode-backend-legacy}
    register-mode: instance
    qos-enable: false
    # ApplicationConfig.protocol defaults to "dubbo"; in a Triple-only
    # deployment that makes ServiceInstanceHostPortCustomizer fall back
    # to "first found protocol" and warn (FAQ 4-2). Pin it to tri.
    protocol: tri
    # metadata-type=local avoids the INSTANCE_REGISTER -> METADATA_REGISTER
    # round trip that requires a config-center (which Phase 1 has not
    # configured) and currently logs the 5-10 "configuration server
    # disconnected" ERROR every cold start.
    metadata-type: local
  protocol:
    name: tri
    port: ${DUBBO_PROTOCOL_PORT:-1}
    triple:
      max-requests-per-connection: 50
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:${NACOS_PORT:28848}?namespace=${DUBBO_NAMESPACE:dev}}
    username: ${DUBBO_REGISTRY_USERNAME:}
    password: ${DUBBO_REGISTRY_PASSWORD:}
    timeout: 5000
    use-as-config-center: false
    use-as-metadata-center: false
    parameters:
      namespace: ${DUBBO_NAMESPACE:dev}
      group: DEFAULT_GROUP
  scan:
    base-packages: com.ulticode.dubbo.provider
  consumer:
    check: false
  provider:
    filter: default
  cloud:
    subscribed-services: ''

# P1-OBS-001: OpenTelemetry / Micrometer Tracing.
# Spring Boot 3.2.5 + micrometer-tracing-bridge-otel gives us W3C
# traceparent extraction and injection on HTTP and (via our
# DubboTraceFilter) on Dubbo RPC. Phase 1 ships with the OTLP
# exporter pointed at a no-op default; the smoke can flip the
# endpoint to a real OTLP collector by setting
# MANAGEMENT_OTLP_TRACING_ENDPOINT.
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 5s

# Make the active trace id and span id visible in every log line.
# This is the log shape the smoke + integration tests will grep for.
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]"

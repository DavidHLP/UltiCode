server:
  port: ${SERVER_PORT:9101}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9002,http://localhost:9003}

spring:
  application:
    name: backend-auth
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:45s}
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: ${SPRING_TASK_SCHEDULING_SHUTDOWN_AWAIT_TERMINATION_PERIOD:45s}
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${AUTH_DB_HOST}:${AUTH_DB_PORT}/${AUTH_DB_NAME}?useUnicode=true&characterEncoding=UTF-8&characterSetResults=utf8mb4&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&useDBAuthPlugin=mysql_native_password
    username: ${AUTH_DB_USER}
    password: ${AUTH_DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      # Per-owner Redis ACL user (review 2026-08-25). Empty default keeps
      # no-auth local dev working; compose maps it per service.
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  flyway:
    # Runtime services must not run the shared/root migration set as auth_rw.
    # Run owner migrations separately with a privileged migration account.
    enabled: ${AUTH_FLYWAY_ENABLED:false}
    locations: filesystem:${AUTH_FLYWAY_MIGRATIONS_DIR:../init-db/migrations/auth}
    baseline-on-migrate: true
    baseline-version: 20260322
    baseline-description: Initial baseline
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

auth:
  audit:
    outbox:
      dispatcher:
        enabled: ${AUTH_AUDIT_OUTBOX_DISPATCHER_ENABLED:true}
        interval-ms: ${AUTH_AUDIT_OUTBOX_DISPATCHER_INTERVAL_MS:2000}
  search:
    outbox:
      dispatcher:
        # SEARCH-001 slice-b: dispatch user-document events from the Auth
        # outbox to stream:integration. Default off: unit-test contexts boot
        # without Redis, and events must not pile up on the stream before the
        # backend-search worker consumer exists (SEARCH-002). Enable in the
        # deployed runtime once the worker is live.
        enabled: ${AUTH_SEARCH_OUTBOX_DISPATCHER_ENABLED:false}
  # Redisson Configuration (distributed locks, OAuth state)
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:26379}"
          # Per-owner Redis ACL user (review 2026-08-25); empty default keeps
          # no-auth local dev working.
          username: ${REDIS_USERNAME:}
          password: ${REDIS_PASSWORD:}
          database: ${REDIS_DB:0}
          connectionPoolSize: 64
          connectionMinimumIdleSize: 10

# JWT Configuration
jwt:
  resource-server:
    enabled: false
  secret: ${JWT_SECRET:}
  # Issuer claim (iss) stamped onto every access and refresh token. Must match
  # jwt.expected-issuer in backend-app and backend-admin application.yml.
  issuer: ${JWT_ISSUER:ulticode-auth}
  # Audience claim (aud) stamped onto every access token. Must match
  # jwt.expected-audience in backend-app and backend-admin application.yml.
  # Refresh tokens do not carry this claim.
  audience: ${JWT_AUDIENCE:ulticode-api}
  # RS256 asymmetric signing (opt-in). When enabled, access tokens are signed
  # with RS256 instead of HS256. The private key must be provided as a
  # base64-encoded PKCS8 PEM string. All Auth replicas MUST share the same
  # key material so that resource servers can verify via the JWKS endpoint.
  # Key rotation: set jwt.rsa.previous-private-key to the old key, update
  # jwt.rsa.private-key to the new key, and restart. Old tokens remain valid
  # until they expire (default 15 minutes).
  rsa:
    enabled: ${JWT_RSA_ENABLED:false}
    private-key: ${JWT_RSA_PRIVATE_KEY:}
    previous-private-key: ${JWT_RSA_PREVIOUS_PRIVATE_KEY:}
  access-token:
    expiration: 900000 # 15 minutes in milliseconds
  refresh-token:
    expiration: 604800000 # 7 days in milliseconds
  cookie:
    access-token:
      name: access_token
      http-only: true
      secure: ${JWT_COOKIE_SECURE:true}
      same-site: lax
      path: /
      domain: ${JWT_COOKIE_DOMAIN:}
      max-age: 900 # 15 minutes in seconds
    refresh-token:
      name: refresh_token
      http-only: true
      secure: ${JWT_COOKIE_SECURE:true}
      same-site: lax
      path: /
      domain: ${JWT_COOKIE_DOMAIN:}
      max-age: 604800 # 7 days in seconds

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ulticode.auth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: input

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 5s
security:
  internal-delegation:
    # Base64-encoded X509 public key; Auth never receives Admin private material.
    public-key: ${INTERNAL_DELEGATION_PUBLIC_KEY:}
    key-id: ${INTERNAL_DELEGATION_KEY_ID:}
    bootstrap-public-key: ${BOOTSTRAP_DELEGATION_PUBLIC_KEY:}
    bootstrap-key-id: ${BOOTSTRAP_DELEGATION_KEY_ID:}
    issuer: ${INTERNAL_DELEGATION_ISSUER:backend-admin}
    audience: ${INTERNAL_DELEGATION_AUDIENCE:backend-auth}

# P1-INFRA-003: Dubbo 3.3.6 + Nacos registry.
dubbo:
  application:
    name: ${DUBBO_APPLICATION_NAME:backend-auth}
    register-mode: instance
    qos-enable: false
    protocol: tri
    metadata-type: local
  protocol:
    name: tri
    ssl-enabled: ${DUBBO_PROTOCOL_SSL_ENABLED:false}
    port: ${DUBBO_PROTOCOL_PORT:20881}
    triple:
      max-requests-per-connection: 50
  ssl:
    default: ${DUBBO_SSL_DEFAULT:false}
    server-key-cert-chain-path: ${DUBBO_SSL_SERVER_KEY_CERT_CHAIN_PATH:}
    server-private-key-path: ${DUBBO_SSL_SERVER_PRIVATE_KEY_PATH:}
    server-trust-cert-collection-path: ${DUBBO_SSL_SERVER_TRUST_CERT_COLLECTION_PATH:}
    client-key-cert-chain-path: ${DUBBO_SSL_CLIENT_KEY_CERT_CHAIN_PATH:}
    client-private-key-path: ${DUBBO_SSL_CLIENT_PRIVATE_KEY_PATH:}
    client-trust-cert-collection-path: ${DUBBO_SSL_CLIENT_TRUST_CERT_COLLECTION_PATH:}
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:${NACOS_PORT:28848}?namespace=${DUBBO_NAMESPACE:dev}}
    username: ${DUBBO_REGISTRY_USERNAME:${AUTH_NACOS_USERNAME:}}
    password: ${DUBBO_REGISTRY_PASSWORD:${AUTH_NACOS_PASSWORD:}}
    timeout: 5000
    # P1-INFRA-003: register-mode=instance 下 provider 必须把 interface→application
    # 映射发布到 metadata/config center, 否则消费方解析不到实例
    # ("No provider available ... invokers: 0[]")。与 backend-app/backend-admin 保持一致。
    use-as-config-center: true
    use-as-metadata-center: true
    parameters:
      namespace: ${DUBBO_NAMESPACE:dev}
      group: DEFAULT_GROUP
  scan:
    base-packages: com.ulticode.auth.dubbo.provider
  consumer:
    check: false
    # P4-RPC-002: §6.4 global consumer defaults — fail-safe for writes.
    # Default is the WRITE boundary: retries=0 (no auto-retry, prevents
    # double-apply on mutating RPCs) + timeout=3000ms (write upper bound).
    # Query RPCs MUST override per-reference:
    #   @DubboReference(timeout=RpcPolicy.QUERY_TIMEOUT_MS, retries=RpcPolicy.QUERY_RETRIES)
    # Rationale: a write RPC that accidentally inherits retry=1 can
    # double-apply a side effect (critical correctness bug); a query RPC
    # that inherits retry=0 is merely conservative (safe, suboptimal).
    timeout: 3000
    retries: 0
  provider:
    filter: default
  cloud:
    subscribed-services: ''

# App-specific configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:9002}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from-name: ${EMAIL_FROM_NAME:UltiCode}

logging:
  level:
    root: INFO
    com.ulticode: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]"

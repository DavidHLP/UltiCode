# Reusable: security-static gate (secret scan).
# Runs on every change set, independent from lint/test/build.
name: Security Gate

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.24.2 \
            dir /repo --config=/repo/.gitleaks.toml --redact --no-banner

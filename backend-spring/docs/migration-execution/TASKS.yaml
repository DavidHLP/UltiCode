    loss; the application-rollback principle means the SQL path is defensive only), or (b) add a follow-up migration that
    documents the MySQL-incompatibility and supplies a verified-on-MySQL rollback script, or (c) make the rollback a stored
    procedure so the IF-EXISTS logic can be expressed without depending on the DDL form. Choose via DECISIONS.md ADR.
  - Dispose of the P2-AUTH-003 verification scaffold (disposable-verify/ + .env.verify) after the chosen fix is decided, OR
    keep it as a documented regression test for additive migrations going forward.
  - The chosen approach is applied to subsequent additive migrations (any future V...__{Add,...}.sql uses the chosen rollback
    form).
  validation:

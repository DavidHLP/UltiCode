      date is recorded in ADR-MIG-AUTH-COMPAT (HMAC until Phase 4 cutover). [3] Ordinary requests do not call Auth via RPC:
      P2-AUTH-002 installed offline resource server JWT verifiers in App and Admin (ResourceServerJwtVerifier.java in both
      modules); the access token is verified locally without an Auth RPC. Gateway → App/Admin → Auth is the only Auth-touching

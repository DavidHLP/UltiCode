# Development Profile Configuration

server:
  port: 3000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ulticode?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password:

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

# JWT Configuration for Development
jwt:
  secret: dev-secret-key-for-local-development-must-be-at-least-32-chars
  cookie:
    secure: false  # Disable secure cookie for local development

# MyBatis-Plus Development Settings
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# SpringDoc Development Settings
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Verbose Logging for Development
logging:
  level:
    com.ulticode: DEBUG
    com.baomidou.mybatisplus: DEBUG
    org.springframework.web: DEBUG

# Publishes one image per deployable service on every main push.
# The service list lives in .github/services-matrix.json, shared with the
# _docker.yml CI verification so a service can never be publishable but
# unverifiable (or vice versa). Adding a service means adding one JSON entry.
name: Docker Publish

on:
  push:
    branches: [main]

concurrency:
  group: docker-publish
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  load-matrix:
    name: Load Service Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read services matrix
        id: m
        run: |
          jq -e 'type == "array" and length > 0' .github/services-matrix.json > /dev/null \
            || { echo "::error::.github/services-matrix.json must be a non-empty array"; exit 1; }
          echo "matrix=$(jq -c . .github/services-matrix.json)" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push (${{ matrix.service.name }})
    needs: load-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.load-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve service release version
        id: svcver
        run: |
          # Per-service Maven release version (services/pom.xml service.version.*)
          PROP="${{ matrix.service.maven_version_property }}"
          VERSION=""
          if [ -n "$PROP" ]; then
            VERSION="$(awk -v prop="$PROP" '
              $0 ~ "<" prop ">" {
                value = $0
                sub(".*<" prop ">", "", value)
                sub("</" prop ">.*", "", value)
                print value
                exit
              }
            ' services/pom.xml)"
            if [ -z "$VERSION" ]; then
              echo "::error::Property <$PROP> not found in services/pom.xml"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Service version: ${VERSION:-<none (non-Maven image)>}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}
          tags: |
            type=sha
            type=raw,value=latest
            type=raw,value=v${{ steps.svcver.outputs.version }},enable=${{ steps.svcver.outputs.version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_MODULE=${{ matrix.service.module }}
            SERVICE_ARTIFACT=${{ matrix.service.artifact }}
            SERVICE_PORT=${{ matrix.service.port }}
            SERVICE_HEALTH_PATH=${{ matrix.service.health_path }}
            INSTALL_DOCKER_CLI=${{ matrix.service.install_docker_cli || false }}
            SERVICE_HEALTHCHECK=${{ matrix.service.healthcheck || true }}
            SERVICE_VERSION=${{ steps.svcver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

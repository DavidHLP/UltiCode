name: Agent Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  agent-test:
    name: Python Agent Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install locked uv version
        run: python -m pip install --disable-pip-version-check uv==0.12.10
      - name: Install locked dependencies and test
        working-directory: services/agent
        run: uv sync --locked && uv run --locked pytest -q

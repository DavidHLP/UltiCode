# Build, scan, and attest digest-only candidates; promote release tags only after
# every service candidate in this source revision has passed verification.
name: Docker Publish

on:
  push:
    branches: [main]

concurrency:
  group: ulticode-release-tag-writer
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write


env:
  REGISTRY: ghcr.io

jobs:
  load-matrix:
    name: Load Service Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read services matrix
        id: m
        run: |
          jq -e 'type == "array" and length == 9' .github/services-matrix.json > /dev/null \
            || { echo "::error::.github/services-matrix.json must contain exactly nine services"; exit 1; }
          echo "matrix=$(jq -c . .github/services-matrix.json)" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Verify Candidate (${{ matrix.service.name }})
    needs: load-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.load-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Resolve service release version
        id: svcver
        env:
          PROP: ${{ matrix.service.maven_version_property }}
        run: |
          set -euo pipefail
          VERSION=""
          if [ -n "$PROP" ]; then
            VERSION="$(awk -v prop="$PROP" '$0 ~ "<" prop ">" { value=$0; sub(".*<" prop ">", "", value); sub("</" prop ">.*", "", value); print value; exit }' services/pom.xml)"
            [ -n "$VERSION" ] || { echo "::error::Property <$PROP> not found"; exit 1; }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image repository
        id: normalize
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize.outputs.image_name }}/${{ matrix.service.name }}
          flavor: latest=false
      - name: Build and push digest-only candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          no-cache-filters: ${{ matrix.service.module && 'runtime' || 'production' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.normalize.outputs.image_name }}/${{ matrix.service.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_MODULE=${{ matrix.service.module }}
            SERVICE_ARTIFACT=${{ matrix.service.artifact }}
            SERVICE_PORT=${{ matrix.service.port }}
            SERVICE_HEALTH_PATH=${{ matrix.service.health_path }}
            INSTALL_DOCKER_CLI=${{ matrix.service.install_docker_cli || false }}
            SERVICE_HEALTHCHECK=${{ matrix.service.healthcheck || true }}
            SERVICE_VERSION=${{ steps.svcver.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=publish-${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.service.name }},ignore-error=true
      - name: Scan pushed candidate
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (Trivy v0.74.0)
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.normalize.outputs.image_name }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}
          format: json
          output: ${{ runner.temp }}/${{ matrix.service.name }}.trivy.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.74.0
      - name: Upload candidate scan report
        if: ${{ always() && steps.scan.outcome != 'skipped' && steps.scan.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-${{ matrix.service.name }}
          path: ${{ runner.temp }}/${{ matrix.service.name }}.trivy.json
          if-no-files-found: warn
          retention-days: 30
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.3
      - name: Sign candidate and attest SBOM/provenance
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.normalize.outputs.image_name }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service.name }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.svcver.outputs.version }}
          SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/docker-publish.yml@refs/heads/main
          SIGNER_ISSUER: https://token.actions.githubusercontent.com
          SBOM_PATH: ${{ runner.temp }}/${{ matrix.service.name }}.spdx.json
          PROVENANCE_PATH: ${{ runner.temp }}/${{ matrix.service.name }}.provenance.json
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::Build did not emit immutable digest"; exit 1; }
          trivy image --format spdx-json --output "$SBOM_PATH" "$IMAGE_REF"
          jq -e . "$SBOM_PATH" >/dev/null
          jq -n --arg source "https://github.com/${{ github.repository }}@${{ github.sha }}" --arg workflow "${{ github.workflow_ref }}" \
            '{buildType:"https://slsa.dev/provenance/v1", builder:{id:$workflow}, invocation:{configSource:{uri:$source}}}' > "$PROVENANCE_PATH"
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type spdxjson --predicate "$SBOM_PATH" "$IMAGE_REF"
          cosign attest --yes --type slsaprovenance --predicate "$PROVENANCE_PATH" "$IMAGE_REF"
          cosign verify --certificate-identity "$SIGNER_IDENTITY" --certificate-oidc-issuer "$SIGNER_ISSUER" "$IMAGE_REF" >/dev/null
          cosign verify-attestation --type spdxjson --certificate-identity "$SIGNER_IDENTITY" --certificate-oidc-issuer "$SIGNER_ISSUER" "$IMAGE_REF" >/dev/null
          cosign verify-attestation --type slsaprovenance --certificate-identity "$SIGNER_IDENTITY" --certificate-oidc-issuer "$SIGNER_ISSUER" "$IMAGE_REF" >/dev/null
      - name: Assemble candidate evidence
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.normalize.outputs.image_name }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service.name }}
          VERSION: ${{ steps.svcver.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/candidate-evidence-$SERVICE"
          mkdir -p "$out"
          variable="${SERVICE^^}"; variable="${variable//-/_}"
          printf '%s_IMAGE_REF=%s\n' "$variable" "$IMAGE_REF" > "$out/$SERVICE.image-ref"
          cp "$RUNNER_TEMP/$SERVICE.spdx.json" "$out/$SERVICE.spdx.json"
          cp "$RUNNER_TEMP/$SERVICE.provenance.json" "$out/$SERVICE.provenance.json"
          cp "$RUNNER_TEMP/$SERVICE.trivy.json" "$out/$SERVICE.trivy.json"
          printf '%s\n' "$VERSION" > "$out/$SERVICE.version"
          printf '%s\n' "$SOURCE_SHA" > "$out/$SERVICE.source-commit"
          jq -n --arg service "$SERVICE" --arg image "$IMAGE_REF" '{service:$service,image_ref:$image}' > "$out/$SERVICE.release.json"
      - name: Upload candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-evidence-${{ matrix.service.name }}
          path: ${{ runner.temp }}/candidate-evidence-${{ matrix.service.name }}/
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Validate and Promote Complete Release
    needs: [load-matrix, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download this run's candidate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-evidence-*
          path: ${{ runner.temp }}/candidate-evidence
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.3
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate candidates and promote release tags
        run: scripts/runbooks/promote-release.sh "$RUNNER_TEMP/candidate-evidence" "${GITHUB_SHA}" ghcr.io/davidhlp/ulticode --execute
      - name: Upload complete release manifest and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-manifest
          path: |
            ${{ runner.temp }}/candidate-evidence/release-manifest.txt
            ${{ runner.temp }}/candidate-evidence/release-set.json
            ${{ runner.temp }}/candidate-evidence/candidate-evidence-*/
          if-no-files-found: error
          retention-days: 90
